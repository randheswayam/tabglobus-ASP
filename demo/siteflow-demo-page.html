<title>SiteFlow Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#ECEEEA; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#1B2428; --ink-2:#56625F; --ink-3:#7F8A87;
  --line:#D5DAD4; --line-2:#E4E7E2;
  --accent:#0E6B6F; --accent-2:#0A5558; --accent-ink:#FFFFFF; --accent-soft:#DCECEA;
  --hivis:#D99613; --hivis-soft:#FBF0D6;
  --ok:#2E7A4D; --ok-soft:#DDEFE3; --warn:#A8660F; --warn-soft:#F8E9D0; --bad:#B42318; --bad-soft:#F9E0DC;
  --shadow:0 1px 2px rgba(20,35,38,.06),0 4px 14px rgba(20,35,38,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111719; --surface:#192124; --surface-2:#1F292C; --ink:#E5EBE8; --ink-2:#9DAAA6; --ink-3:#72807C;
    --line:#2D393C; --line-2:#253033;
    --accent:#4CB2AE; --accent-2:#6CC7C3; --accent-ink:#08191A; --accent-soft:#1B3637;
    --hivis:#EDB23D; --hivis-soft:#3A2F17;
    --ok:#5DBB82; --ok-soft:#18342A; --warn:#E3A948; --warn-soft:#3A2D16; --bad:#F2786D; --bad-soft:#3D1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111719; --surface:#192124; --surface-2:#1F292C; --ink:#E5EBE8; --ink-2:#9DAAA6; --ink-3:#72807C;
  --line:#2D393C; --line-2:#253033;
  --accent:#4CB2AE; --accent-2:#6CC7C3; --accent-ink:#08191A; --accent-soft:#1B3637;
  --hivis:#EDB23D; --hivis-soft:#3A2F17;
  --ok:#5DBB82; --ok-soft:#18342A; --warn:#E3A948; --warn-soft:#3A2D16; --bad:#F2786D; --bad-soft:#3D1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-2)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.whois{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.whois select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:13px}
.credit{font-size:10.5px;color:var(--ink-3);padding:0 6px;letter-spacing:.04em}

main{min-width:0;padding-inline:32px;padding-block:24px 48px}
.mtop,.tabs{display:none}
.offline{display:flex;gap:8px;align-items:center;background:var(--hivis-soft);color:var(--warn);border:1px solid var(--hivis);padding:8px 12px;border-radius:8px;margin-bottom:16px;font-weight:500}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{color:var(--ink-2);margin-top:4px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.5px;margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--ink-2);font-size:12.5px}
.kpi.alert b{color:var(--bad)}
.kpi.attn b{color:var(--hivis)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.pill.active{background:var(--hivis-soft);color:var(--warn);border-color:transparent}
.pill.submitted,.pill.review{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.rework,.pill.overdue{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* task list */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task .ti{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.task-capture .ti{background:var(--hivis-soft);color:var(--warn)}
.task-review .ti{background:var(--accent-soft);color:var(--accent-2)}
.task b{font-weight:600;display:block}
.task .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:22px 16px;color:var(--ink-2);text-align:center}

/* project cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.pcard:hover{border-color:var(--accent)}
.pcard h3{font-size:16px}
.pcard .loc{font-size:12.5px;color:var(--ink-2)}
.ministep{display:flex;gap:4px}
.ministep i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ministep i.done{background:var(--ok)}
.ministep i.active,.ministep i.rework{background:var(--hivis)}
.ministep i.submitted{background:var(--accent)}
.pcard .now{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}

/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.fi:last-child{border-bottom:0}
.fi .fic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.fi .fic svg{width:15px;height:15px}
.fi.ok .fic{background:var(--ok-soft);color:var(--ok)}
.fi.warn .fic{background:var(--bad-soft);color:var(--bad)}
.fi.ms .fic{background:var(--hivis-soft);color:var(--warn)}
.fi.unread{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.fi .when{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ch{font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink-3)}

/* stepper */
.stepper-wrap{overflow-x:auto;margin-bottom:20px}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:0;min-width:min-content}
.st{flex:1;min-width:150px;position:relative}
.st button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px 12px 0;border:0;background:none;text-align:left}
.st::before{content:"";position:absolute;top:26px;left:30px;right:0;height:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.st-done::before{background:var(--ok)}
.st-n{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--ink-3)}
.st-done .st-n{background:var(--ok);border-color:var(--ok);color:#fff}
.st-active .st-n,.st-rework .st-n{border-color:var(--hivis);color:var(--warn);background:var(--hivis-soft)}
.st-submitted .st-n{border-color:var(--accent);color:var(--accent)}
.st-n svg{width:15px;height:15px;stroke-width:2.6}
.st-l{font-weight:600;font-size:13.5px;padding-right:10px}
.st-s{font-size:12px;color:var(--ink-2)}

.steps{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.scard.cur{border-color:var(--hivis);box-shadow:inset 3px 0 0 var(--hivis)}
.scard .who{font-size:12.5px;color:var(--ink-2)}
.branches{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.branch{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.thumbs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.team{display:flex;flex-direction:column;gap:8px}
.person{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.audit{display:flex;flex-direction:column;gap:10px;font-size:12.5px;max-height:320px;overflow:auto}
.audit div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req{font-size:10.5px;font-weight:600;color:var(--warn);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:14px}
.field textarea{resize:vertical;min-height:76px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.miss input,.field.miss textarea,.field.miss select{border-color:var(--bad)}
.ro{padding:8px 0;white-space:pre-wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.sec-h h3{display:flex;gap:8px;align-items:center}
.sec-b{padding:16px}

.act{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.reqpanel{position:sticky;top:20px}
.reqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.reqlist li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.reqlist .ck{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);margin-top:1px}
.reqlist li.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.reqlist li.ok .ck svg{width:11px;height:11px;stroke-width:3}
.reqlist li.no{color:var(--ink-2)}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .25s}
.errbox{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner.rework{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--accent-2)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.saved{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.ph button svg{width:13px;height:13px}
.addph{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);background:none;font-size:12.5px;font-weight:600;max-width:100%}
.addph:hover{border-color:var(--accent);color:var(--accent)}
.addph svg{width:22px;height:22px}
.pcount{font-family:var(--f-mono);font-size:12.5px}
.ph-tag{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 5px}
.ph-video{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:11.5px;font-weight:600}
.ph-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .2s}
.ph-up{border-style:dashed}
button.ph{padding:0;cursor:zoom-in}
/* dashboard */
.filters{margin-bottom:16px}
.filters summary{cursor:pointer;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.flt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.flt{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.flt input,.flt select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13px;color:var(--ink);width:100%}
.dash-table tr.clickable{cursor:pointer}
.dash-table tr.clickable:hover td{background:var(--surface-2)}
.dash-table td{vertical-align:top;padding:9px 8px}
.attn-row{cursor:default}
.linkish{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);text-align:left}
.linkish:hover{color:var(--accent)}
.flag-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.flag-chip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flag-clear-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.flag-clear-form .inp{flex:1;min-width:160px;padding:6px 9px;font-size:13px}
.major-row{width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left}
.major-row:hover{background:var(--surface-2)}
.major-thumb{width:44px;height:34px;border-radius:5px;overflow:hidden;background:var(--surface-2);display:block}
.major-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.major-row.fi{grid-template-columns:44px minmax(0,1fr)}
.overdue-text{color:var(--bad);font-weight:600}
/* stage tracker */
.section-h{font-size:15px;margin:18px 0 10px}
.so-summary{white-space:pre-wrap}
.row-bad td{background:var(--warn-soft)}
.pthumb{flex:none;display:grid;place-items:center;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-3)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb.sm{width:36px;height:36px}.pthumb.sm .wi{width:18px;height:18px}
.pthumb.md{width:48px;height:48px}.pthumb.md .wi{width:22px;height:22px}
.pthumb.lg{width:72px;height:72px;border-radius:10px}.pthumb.lg .wi{width:30px;height:30px}
.pcard-h{display:flex;gap:12px;align-items:flex-start}
.wfc{position:fixed;z-index:60;width:460px;max-width:calc(100vw - 24px);max-height:min(78vh,720px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,35,38,.22);padding:12px 14px;font-size:12px}
.wfc[hidden]{display:none}
.wfc:not(.pinned){pointer-events:none}
.wfc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.wfc-h b{font-size:14px}
.wfc-legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.wfc-legend span{display:inline-flex;align-items:center;gap:4px}
.wfc-ph{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px dashed var(--line-2)}
.wfc-ph-name{font-weight:600;font-size:11px;color:var(--ink-2);line-height:1.3}

/* ---------- SiteFlow demo API ----------
   Same interface as api.js, but the workflow runs in the browser with sample data, so the demo works
   as a single file with no server. The rules mirror the FastAPI backend: roles and project visibility,
   Legal Approval transitions, mandatory site visit validation with photo evidence, derived progress,
   the Team Lead review with recurring visits, open problems, red flags, the dashboard, notifications,
   the 18-stage tracker, client invites, milestone sign-offs, the client app and shared site updates.
   Sprint v4 adds: stage gates with recorded exceptions, stage files and completion notes, workflow health
   (phase icons and the callout), project images, the fee plan, the Accounts fee ledger, the principal
   overview, and the Admin team, membership and CSV import screens.
   DEMO_TEMPLATE is injected by build.py from the backend's template and workflow config, so stages,
   checklists, the problem list, media limits and red flag thresholds stay in step. */
/* global DEMO_TEMPLATE */
/* exported SiteFlowAPI */
const SiteFlowAPI = (() => {
  'use strict';
  const T = DEMO_TEMPLATE;
  const K_DB = 'siteflow.demo.db.v4', K_TOKEN = 'siteflow.demo.token';
  const PASSWORD = 'demo';
  const mem = {};
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (_) { return mem[k] ?? null; } },
    set(k, v){
      try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; }
      catch (e) { if (e && e.name === 'QuotaExceededError') return false; if (v == null) delete mem[k]; else mem[k] = v; return true; }
    }
  };

  class ApiError extends Error {
    constructor(status, message, detail){ super(message); this.status = status; this.detail = detail; }
    get missing(){ return (this.detail && this.detail.missing) || []; }
    get invalid(){ return (this.detail && this.detail.invalid) || []; }
  }
  const fail = (status, message, extra) => { throw new ApiError(status, message, extra ? {message, missing: [], invalid: [], ...extra} : message); };

  /* ---------- storage ---------- */
  let db = null, clockOffset = 0, onSignedOut = null;
  const sessionFiles = {};  // videos live only for this browser session; photos are kept as small JPEGs
  const nowMs = () => Date.now() - clockOffset;
  const now = () => new Date(nowMs()).toISOString();
  const ymd = daysAgo => new Date(Date.now() - daysAgo * 864e5).toISOString().slice(0, 10);
  function load(){ try { db = JSON.parse(store.get(K_DB) || 'null'); } catch (_) { db = null; } if (!db || db.v !== 4) seed(); }
  function save(){ if (!store.set(K_DB, JSON.stringify(db))) fail(507, 'The demo has run out of browser storage. Use Reset demo data to start again.'); }
  const nextId = kind => (db.seq[kind] = (db.seq[kind] || 0) + 1);
  const user = id => db.users.find(u => u.id === id);
  const brief = u => u ? {id: u.id, name: u.name, role: u.role} : null;
  const userOut = u => ({id: u.id, name: u.name, email: u.email, role: u.role, active: u.active !== false, principal: !!u.principal});
  const meOut = u => ({id: u.id, name: u.name, email: u.email, role: u.role, principal: !!u.principal});
  const byId = (list, id) => list.find(x => x.id === +id);

  /* ---------- auth and access ---------- */
  function current(){
    const t = store.get(K_TOKEN), u = t && user(+t);
    if (!u){ store.set(K_TOKEN, null); if (t && onSignedOut) onSignedOut(); fail(401, 'Not authenticated'); }
    return u;
  }
  function role(u, ...roles){ if (!roles.includes(u.role)) fail(403, 'Your role cannot perform this action'); }
  function staff(){ const u = current(); if (u.role === 'client') fail(403, 'This area is for the SiteFlow team. Clients use the client app.'); return u; }
  function clientUser(){ const u = current(); if (u.role !== 'client') fail(403, 'This area is the client app'); return u; }
  const seesAll = u => u.role === 'architect' || u.role === 'team_lead';
  const visible = u => db.projects.filter(p => seesAll(u) || p.members.includes(u.id));
  function project(u, id){ const p = visible(u).find(x => x.id === +id); if (!p) fail(404, 'Project not found'); return p; }
  function visibleVisit(u, id){ const v = byId(db.visits, id); if (!v || !visible(u).some(p => p.id === v.project_id)) fail(404, 'Site visit not found'); return v; }

  /* ---------- workflow ---------- */
  const audit = (p, u, action, detail = {}) => db.audit.push({project_id: p.id, actor_id: u ? u.id : null, action, detail, at: now()});
  const step = (p, order) => p.steps.find(s => s.order === order);
  function setStep(p, order, status, u){
    const s = step(p, order); if (s.status === status) return;
    s.status = status;
    if (status === 'completed') s.completed_at = now();
    audit(p, u, {active: 'step.activated', completed: 'step.completed', locked: 'step.locked'}[status], {step: s.name});
  }
  const visitsOf = p => db.visits.filter(v => v.project_id === p.id);
  const submittedVisits = p => visitsOf(p).filter(v => v.status !== 'draft');
  const latest = p => { const vs = submittedVisits(p); return vs[vs.length - 1] || null; };
  const openVisit = p => visitsOf(p).find(v => v.status === 'rework' || v.status === 'draft');
  const engineerOf = p => p.members.map(user).find(u => u && u.role === 'civil_engineer') || null;
  const reviewsOf = v => db.reviews.filter(r => r.visit_id === v.id);
  const mediaOf = v => db.media.filter(m => m.visit_id === v.id);
  const approvedAt = v => { const r = reviewsOf(v).filter(x => x.decision === 'approve').pop(); return r ? r.at : null; };

  /* ---------- notifications (mirror services/notify.py) ---------- */
  function send(users, kind, p, text, actor){
    const seen = new Set();
    users.forEach(u => { if (!u || seen.has(u.id) || (actor && u.id === actor.id)) return; seen.add(u.id);
      db.notifications.push({id: nextId('note'), user_id: u.id, project_id: p.id, kind, text, created_at: now(), read_at: null}); });
  }
  const leads = () => db.users.filter(u => u.role === 'team_lead');
  const architectOf = p => user(p.created_by);

  /* ---------- progress (mirrors services/progress.py) ---------- */
  function deriveProgress(stageName, states){
    const idx = T.stages.findIndex(s => s.name === stageName), stage = T.stages[idx];
    const done = stage.checklist.filter(i => states[i.id] === 'Done').length;
    const total = T.stages.slice(0, idx).reduce((a, s) => a + s.weight, 0) + stage.weight * done / stage.checklist.length;
    return Math.round((total + 1e-9) * 10) / 10;
  }

  /* ---------- validation (mirrors services/validation.py) ---------- */
  function validate(b, media){
    const miss = [], inv = [], blank = v => v == null || (typeof v === 'string' && !v.trim());
    ['visit_at', 'weather', 'attendees', 'current_stage', 'summary', 'recommended_action'].forEach(f => { if (blank(b[f])) miss.push(f); });
    const loc = b.location;
    if (!loc || (!loc.gps && blank(loc.manual))) miss.push('location');
    else if (loc.gps && !(Math.abs(loc.gps.lat) <= 90 && Math.abs(loc.gps.lng) <= 180)) inv.push('location.gps');
    const checklist = b.checklist || {}, problems = b.problems || [];
    if (!blank(b.current_stage)){
      const stage = T.stages.find(s => s.name === b.current_stage);
      if (!stage) inv.push('current_stage');
      else {
        const ids = stage.checklist.map(i => i.id);
        ids.forEach(i => { if (!(i in checklist)) miss.push('checklist.' + i); });
        Object.entries(checklist).forEach(([k, st]) => { if (!ids.includes(k) || !T.checklist_states.includes(st)) inv.push('checklist.' + k); });
      }
    }
    if (b.no_issues && problems.length) inv.push('no_issues');
    else if (!b.no_issues && !problems.length) miss.push('problems');
    problems.forEach((p, n) => {
      const at = `problems[${n}]`;
      if (blank(p.category)) miss.push(at + '.category');
      else if (!(p.category in T.problems)) inv.push(at + '.category');
      else if (p.category === 'Other'){ if (blank(p.other_text)) miss.push(at + '.other_text'); }
      else if (blank(p.problem)) miss.push(at + '.problem');
      else if (!T.problems[p.category].includes(p.problem)) inv.push(at + '.problem');
      if (blank(p.severity)) miss.push(at + '.severity');
      else if (!T.severities.includes(p.severity)) inv.push(at + '.severity');
      ['location', 'responsible_party', 'target_date'].forEach(f => { if (blank(p[f])) miss.push(`${at}.${f}`); });
    });
    const photos = media.filter(m => m.kind === 'photo');
    if (photos.length < T.min_photos) miss.push('photos');
    const tagged = new Set(photos.map(m => m.problem_ref));
    problems.forEach((p, n) => { if (['High', 'Critical'].includes(p.severity) && !tagged.has(n)) miss.push(`problems[${n}].photo`); });
    return [miss, inv];
  }

  /* ---------- red flags (mirror services/red_flags.py) ---------- */
  const RULES = T.red_flag_rules;
  // The office's calendar day (Asia/Kolkata), not UTC: mirrors app/clock.py.
  const businessDate = ms => new Intl.DateTimeFormat('en-CA', {timeZone: T.business_timezone, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date(ms));
  function evaluateFlags(p, at){
    const out = new Set(), today = businessDate(at), W = T.workflow;
    db.problems.filter(x => x.project_id === p.id && x.status === 'open').forEach(x => {
      if (['High', 'Critical'].includes(x.severity)) out.add(`critical_issue|problem-${x.id}`);
      if (x.target_date < today) out.add(`overdue_fix|problem-${x.id}`);
    });
    if (p.legal.status !== 'Approved' && p.legal.expected_date && today > p.legal.expected_date) out.add('legal_delay|project');
    visitsOf(p).forEach(v => {
      if (v.status === 'submitted' && v.submitted_at && at - Date.parse(v.submitted_at) > W.review_sla_hours * 36e5) out.add(`review_overdue|visit-${v.id}`);
      if (v.status !== 'approved' && reviewsOf(v).filter(r => r.decision === 'rework').length >= W.rework_limit) out.add(`repeated_rework|visit-${v.id}`);
    });
    const approvals = visitsOf(p).map(approvedAt).filter(Boolean).sort();
    const since = approvals.length ? approvals[approvals.length - 1] : (step(p, 1).status === 'completed' ? step(p, 1).completed_at : null);
    if (step(p, 2).status === 'active' && since && at - Date.parse(since) > W.visit_interval_days * 864e5) out.add('no_recent_visit|project');
    db.signoffs.filter(r => r.project_id === p.id && r.status === 'sent' && at - Date.parse(r.sent_at) > T.signoff.sla_days * 864e5)
      .forEach(r => out.add(`client_decision_overdue|signoff-${r.id}`));
    return out;
  }
  function syncFlags(p){
    const at = nowMs(), holding = evaluateFlags(p, at), latestFlag = {};
    db.flags.filter(f => f.project_id === p.id).forEach(f => { latestFlag[`${f.rule}|${f.key}`] = f; });
    [...holding].sort().forEach(k => {
      const f = latestFlag[k];
      if (!f || f.condition_ended_at){
        const [rule, key] = k.split('|');
        const nf = {id: nextId('flag'), project_id: p.id, rule, key, raised_at: now(), cleared_at: null, clear_kind: null,
          cleared_by: null, clear_reason: null, condition_ended_at: null};
        db.flags.push(nf);
        audit(p, null, 'red_flag.raised', {rule, key, label: RULES[rule].label});
        send([architectOf(p), ...leads()], 'red_flag', p, `Red flag on ${p.name}: ${RULES[rule].label}.`);
      }
    });
    Object.entries(latestFlag).forEach(([k, f]) => {
      if (holding.has(k) || f.condition_ended_at) return;
      f.condition_ended_at = now();
      if (!f.cleared_at){ f.cleared_at = now(); f.clear_kind = 'auto'; audit(p, null, 'red_flag.cleared', {rule: f.rule, key: f.key, label: RULES[f.rule].label}); }
    });
  }
  const flagOut = f => ({id: f.id, project_id: f.project_id, rule: f.rule, label: RULES[f.rule].label, rank: RULES[f.rule].rank, key: f.key,
    raised_at: f.raised_at, cleared_at: f.cleared_at, clear_kind: f.clear_kind, clear_reason: f.clear_reason, cleared_by: brief(user(f.cleared_by))});

  /* ---------- serializers (mirror schemas.py) ---------- */
  const mediaOut = m => ({id: m.id, kind: m.kind, problem_ref: m.problem_ref, content_type: m.content_type, size: m.size,
    captured_at: m.captured_at, lat: m.lat, lng: m.lng, uploader: brief(user(m.uploader_id))});
  function visitBrief(v){
    if (!v) return null;
    const rw = reviewsOf(v).filter(r => r.decision === 'rework').pop();
    return {id: v.id, status: v.status, submission_count: v.submission_count, computed_progress: v.computed_progress,
      submitted_at: v.submitted_at, rework_comment: rw && v.status === 'rework' ? rw.comment : null};
  }
  function visitOut(v){
    const p = byId(db.projects, v.project_id);
    return {...visitBrief(v), project: {id: p.id, name: p.name, location: p.location}, engineer: brief(user(v.engineer_id)),
      current_stage: v.current_stage, form: v.form, checklist: v.checklist, no_issues: v.no_issues, problems: v.problems,
      media: mediaOf(v).map(mediaOut),
      reviews: reviewsOf(v).map(r => ({decision: r.decision, comment: r.comment, reviewer: brief(user(r.reviewer_id)), at: r.at}))};
  }
  // Field rules (mirror modules/identity/fields.py): only these roles receive the fee plan.
  const FEE_PLAN_ROLES = ['admin', 'accounts', 'team_lead', 'architect'];
  const seesFeePlan = u => !!u && FEE_PLAN_ROLES.includes(u.role);
  function summary(p, u){
    const v = latest(p), active = p.steps.find(s => s.status === 'active');
    return {id: p.id, name: p.name, location: p.location, current_step: active ? active.name : null,
      official_progress: p.official_progress, latest_visit_status: v ? v.status : null, civil_engineer: brief(engineerOf(p)),
      ...stageSummary(p), ...(seesFeePlan(u) ? {fee_plan: feePlanOut(p)} : {}), image: imageOut(p), workflow: projectHealth(p)};
  }
  function detail(p, u){
    const approved = visitsOf(p).filter(v => v.status === 'approved').length;
    return {...summary(p, u), template: {id: T.id, version: T.version}, steps: p.steps.map(s => ({order: s.order, name: s.name, status: s.status})),
      legal_approval: {...p.legal}, latest_visit: visitBrief(latest(p)),
      approved_visits: approved, visit_number: step(p, 1).status === 'completed' ? approved + 1 : null,
      audit: db.audit.filter(e => e.project_id === p.id).map(e => ({action: e.action, actor: e.actor_id ? (user(e.actor_id) || {}).name : null, at: e.at,
        detail: e.action.startsWith('fee_plan.') && !seesFeePlan(u) ? {} : e.detail}))};
  }
  function problemOut(x){
    const p = byId(db.projects, x.project_id);
    const photos = db.media.filter(m => m.visit_id === x.visit_id && m.kind === 'photo');
    const photo = photos.find(m => m.problem_ref === x.index) || photos[0];
    return {...x, project: {id: p.id, name: p.name}, resolved_by: brief(user(x.resolved_by)), photo_id: photo ? photo.id : null};
  }
  function queueRows(ids){
    return db.visits.filter(v => v.status === 'submitted' && ids.includes(v.project_id)).sort((a, b) => a.submitted_at.localeCompare(b.submitted_at)).map(v => {
      const p = byId(db.projects, v.project_id);
      return {id: v.id, project: {id: p.id, name: p.name, location: p.location}, engineer: brief(user(v.engineer_id)),
        current_stage: v.current_stage, submission_count: v.submission_count, computed_progress: v.computed_progress,
        submitted_at: v.submitted_at, waiting_minutes: Math.max(0, Math.floor((Date.now() - Date.parse(v.submitted_at)) / 6e4))};
    });
  }

  /* ---------- operations (mirror the routers) ---------- */
  function createProject(u, b){
    role(u, 'architect');
    const name = (b.name || '').trim(), location = (b.location || '').trim();
    if (!name || !location) fail(422, 'Project name and location are required');
    const eng = user(+b.civil_engineer_id);
    if (!eng || eng.role !== 'civil_engineer') fail(422, 'civil_engineer_id must be an active Civil Engineer');
    const start = b.start_stage || null, confirmer = (b.historical_confirmed_by || '').trim();
    if (start && (!BYKEY[start] || start === FLOW[0].key)) fail(422, 'start_stage must be a later stage of the residential flow');
    if (start && !confirmer) fail(422, 'historical_confirmed_by is required when start_stage is set');
    const admins = db.users.filter(x => x.role === 'admin').map(x => x.id);
    const p = {id: nextId('project'), name, location, created_by: u.id, official_progress: 0, members: [...new Set([u.id, eng.id, ...admins])],
      steps: T.steps.map((s, i) => ({order: i + 1, name: s, status: i === 0 ? 'active' : 'locked', completed_at: null})),
      legal: {status: 'Not started', authority_name: null, application_reference: null, application_date: null,
        approval_date: null, expected_date: b.legal_expected_date || null, document_reference: null}};
    db.projects.push(p);
    audit(p, u, 'project.created', {civil_engineer_id: eng.id, start_stage: start, historical_confirmed_by: start ? confirmer : null});
    const cut = start ? FLOW.findIndex(x => x.key === start) : 0;
    p.stages = Object.fromEntries(FLOW.map((x, i) => [x.key, {status: i < cut ? 'historical' : 'locked', started_at: null, completed_at: null,
      completed_by: null, note: null, hist_by: i < cut ? confirmer : null, hist_note: i < cut ? 'Completed before SiteFlow.' : null}]));
    releaseStages(p, u);
    return p;
  }

  const LEGAL_NEXT = {'Not started': ['Applied'], 'Applied': ['Approved', 'Rejected']};
  const LEGAL_REQ = {Applied: ['authority_name', 'application_reference', 'application_date'],
    Approved: ['authority_name', 'application_reference', 'application_date', 'approval_date', 'document_reference']};
  function updateLegal(u, pid, b){
    role(u, 'admin');
    const p = project(u, pid), la = p.legal, cur = la.status, target = b.status || cur;
    if (!LEGAL_NEXT[cur]) fail(409, `Legal Approval is ${cur} and can no longer change`);
    if (target !== cur && !LEGAL_NEXT[cur].includes(target)) fail(409, `Cannot move Legal Approval from ${cur} to ${target}`);
    const changes = {};
    LEGAL_REQ.Approved.forEach(f => { if (f in b) changes[f] = typeof b[f] === 'string' ? (b[f].trim() || null) : b[f]; });
    const merged = {...la, ...changes};
    const missing = (LEGAL_REQ[target] || []).filter(f => !merged[f]);
    if (missing.length) fail(422, `${target} needs every required field`, {missing});
    if (merged.approval_date && merged.application_date && merged.approval_date < merged.application_date) fail(422, 'approval_date cannot be before application_date');
    Object.assign(la, changes, {status: target});
    audit(p, u, 'legal.updated', {from: cur, to: target, fields: Object.keys(changes).sort()});
    if (target === 'Approved'){
      setStep(p, 1, 'completed', u); setStep(p, 2, 'active', u);
      send([engineerOf(p)], 'step_unlocked', p, `Legal Approval is approved on ${p.name}. Site Visit is open.`, u);
    }
    syncFlags(p);
    return p;
  }

  function openDraft(u, pid){
    role(u, 'civil_engineer');
    const p = project(u, pid);
    requireSiteVisitOpen(p);
    let v = openVisit(p);
    if (!v){ v = {id: nextId('visit'), project_id: p.id, engineer_id: u.id, status: 'draft', submission_count: 0, form: {}, checklist: {}, problems: [], no_issues: false, created_at: now()}; db.visits.push(v); }
    return v;
  }

  function submitVisit(u, pid, b){
    role(u, 'civil_engineer');
    const p = project(u, pid);
    requireSiteVisitOpen(p);
    let v = openVisit(p);
    const [missing, invalid] = validate(b, v ? mediaOf(v) : []);
    if (missing.length || invalid.length) fail(422, 'Site visit is incomplete', {missing, invalid});
    if (!v){ v = {id: nextId('visit'), project_id: p.id, submission_count: 0, created_at: now()}; db.visits.push(v); }
    Object.assign(v, {engineer_id: u.id, current_stage: b.current_stage,
      form: {visit_at: b.visit_at, location: b.location, weather: b.weather.trim(), attendees: b.attendees.trim(),
        summary: b.summary.trim(), recommended_action: b.recommended_action.trim()},
      checklist: {...b.checklist}, no_issues: !!b.no_issues, problems: (b.problems || []).map(x => ({...x})),
      computed_progress: deriveProgress(b.current_stage, b.checklist), status: 'submitted',
      submission_count: v.submission_count + 1, submitted_at: now()});
    audit(p, u, 'site_visit.submitted', {submission: v.submission_count, computed_progress: v.computed_progress});
    setStep(p, 2, 'completed', u); setStep(p, 3, 'active', u);
    send(leads(), 'submitted', p, `${u.name} submitted a site visit on ${p.name} for review.`, u);
    syncFlags(p);
    return v;
  }

  function review(u, vid, b){
    role(u, 'team_lead');
    const v = visibleVisit(u, vid);
    if (v.status !== 'submitted') fail(409, `Site visit is ${v.status}, not waiting for review`);
    const comment = (b.comment || '').trim() || null;
    if (!['approve', 'rework'].includes(b.decision)) fail(422, 'Decision must be approve or rework');
    if (b.decision === 'rework' && !comment) fail(422, 'Rework needs a comment for the engineer', {missing: ['comment']});
    const p = byId(db.projects, v.project_id);
    db.reviews.push({id: nextId('review'), visit_id: v.id, reviewer_id: u.id, decision: b.decision, comment, at: now()});
    const d = {submission: v.submission_count, comment};
    if (b.decision === 'approve'){
      v.status = 'approved'; p.official_progress = v.computed_progress;
      audit(p, u, 'site_visit.approved', {...d, official_progress: v.computed_progress});
      v.problems.forEach((x, n) => db.problems.push({id: nextId('problem'), project_id: p.id, visit_id: v.id, index: n, category: x.category,
        problem: x.category === 'Other' ? x.other_text : x.problem, severity: x.severity, location: x.location,
        responsible_party: x.responsible_party, target_date: x.target_date, status: 'open', created_at: now(),
        resolved_at: null, resolved_by: null, resolution_note: null}));
      send([engineerOf(p), architectOf(p)], 'approved', p, `The site visit on ${p.name} is approved. Progress ${v.computed_progress}% is now official.`, u);
      setStep(p, 3, 'completed', u); setStep(p, 2, 'active', u); setStep(p, 3, 'locked', u);
      if (p.stages[CONSTRUCTION_START].status === 'active')
        completeStage(p, CONSTRUCTION_START, u, 'Completed when the first construction visit was approved.');
    } else {
      v.status = 'rework';
      audit(p, u, 'site_visit.rework_requested', d);
      setStep(p, 3, 'locked', u); setStep(p, 2, 'active', u);
      send([engineerOf(p)], 'rework', p, `${u.name} sent the site visit on ${p.name} back for rework: ${comment}`, u);
    }
    syncFlags(p);
    return v;
  }

  function resolveProblem(u, id, note){
    role(u, 'civil_engineer', 'team_lead');
    const x = byId(db.problems, id);
    if (!x || !visible(u).some(p => p.id === x.project_id)) fail(404, 'Problem not found');
    if (x.status === 'resolved') fail(409, 'This problem is already resolved');
    note = (note || '').trim();
    if (!note) fail(422, 'Say how the problem was resolved', {missing: ['note']});
    Object.assign(x, {status: 'resolved', resolved_at: now(), resolved_by: u.id, resolution_note: note});
    const p = byId(db.projects, x.project_id);
    audit(p, u, 'problem.resolved', {problem_id: x.id, problem: x.problem, note});
    syncFlags(p);
    return x;
  }

  function dashboard(u, f){
    const projects = visible(u);
    projects.forEach(syncFlags);
    const open = db.problems.filter(x => x.status === 'open' && projects.some(p => p.id === x.project_id));
    const match = x => (!f.severity || x.severity === f.severity) && (!f.category || x.category === f.category);
    let rows = projects.map(p => {
      const flags = db.flags.filter(x => x.project_id === p.id && !x.cleared_at).map(flagOut).sort((a, b) => b.rank - a.rank || a.raised_at.localeCompare(b.raised_at));
      const last = visitsOf(p).map(approvedAt).filter(Boolean).sort().pop() || null;
      const waiting = db.signoffs.find(r => r.project_id === p.id && r.status === 'sent');
      const client = clientsOf(p)[0];
      return {id: p.id, name: p.name, location: p.location, current_step: summary(p).current_step, official_progress: p.official_progress,
        open_problems: open.filter(x => x.project_id === p.id).length, last_visit_at: last, red_flags: flags.length,
        flag_labels: flags.map(x => x.label), flags, civil_engineer: brief(engineerOf(p)), ...stageSummary(p),
        client: client ? client.name : null, ...(seesFeePlan(u) ? {fee_plan: feePlanOut(p)} : {}), image: imageOut(p), workflow: projectHealth(p),
        waiting_for_client: waiting ? {signoff_id: waiting.id, stage: BYKEY[waiting.stage_key].label, version: waiting.version,
          sent_at: waiting.sent_at, days_waiting: Math.floor((Date.now() - Date.parse(waiting.sent_at)) / 864e5)} : null};
    });
    const has = k => f[k] !== undefined && f[k] !== '';
    rows = rows.filter(r => (!has('q') || r.name.toLowerCase().includes(f.q.toLowerCase()))
      && (!has('location') || r.location.toLowerCase().includes(f.location.toLowerCase()))
      && (!has('step') || r.current_step === f.step)
      && (!has('engineer_id') || (r.civil_engineer && r.civil_engineer.id === +f.engineer_id))
      && (!has('red_flag') || (r.flags.length > 0) === (f.red_flag === 'true'))
      && ((!has('severity') && !has('category')) || open.some(x => x.project_id === r.id && match(x)))
      && (!has('progress_min') || r.official_progress >= +f.progress_min)
      && (!has('progress_max') || r.official_progress <= +f.progress_max)
      && (!has('visit_from') || (r.last_visit_at && businessDate(Date.parse(r.last_visit_at)) >= f.visit_from))
      && (!has('visit_to') || (r.last_visit_at && businessDate(Date.parse(r.last_visit_at)) <= f.visit_to))
      && (!has('phase') || (r.phase && r.phase.number === +f.phase))
      && (!has('client_pending') || (r.waiting_for_client !== null) === (f.client_pending === 'true')));
    const kept = rows.map(r => r.id), order = {Critical: 0, High: 1};
    return {
      all_projects: rows,
      needs_attention: rows.filter(r => r.flags.length).sort((a, b) => b.flags[0].rank - a.flags[0].rank
        || a.flags.map(x => x.raised_at).sort()[0].localeCompare(b.flags.map(x => x.raised_at).sort()[0])),
      major_problems: open.filter(x => kept.includes(x.project_id) && x.severity in order && match(x))
        .sort((a, b) => order[a.severity] - order[b.severity] || a.target_date.localeCompare(b.target_date)).map(problemOut),
      review_queue: queueRows(kept),
      waiting_for_client: rows.filter(r => r.waiting_for_client).sort((a, b) => b.waiting_for_client.days_waiting - a.waiting_for_client.days_waiting)
    };
  }

  /* ---------- stage tracker (mirrors services/stages.py) ---------- */
  const FLOW = T.stage_flow, BYKEY = Object.fromEntries(FLOW.map(x => [x.key, x])), DONE = ['completed', 'historical'];
  const CONSTRUCTION_START = 'line_out', HISTORICAL_LABEL = 'Historical — completed before SiteFlow';
  const STAFF_COMPLETERS = ['architect', 'team_lead'];
  const latestSignoff = (p, key) => db.signoffs.filter(r => r.project_id === p.id && r.stage_key === key).sort((a, b) => a.version - b.version).pop();
  const fmtDay = iso => new Date(iso).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
  // Mirrors modules/workflow/gates.py: a stage's reasons are every unmet gate's reasons, in order.
  const PLACEHOLDERS = T.placeholder_gates;
  const isSignoff = x => x.gates.includes('client_signoff');
  const hasException = (p, key, gate) => (p.exceptions || []).some(e => e.stage_key === key && e.gate === gate);
  function oneGate(p, x, gate){
    if (gate === 'legal_approval') return p.legal.status !== 'Approved' ? [`Legal Approval is ${p.legal.status}, not Approved`] : [];
    if (gate === 'no_open_major_problems'){
      const n = db.problems.filter(q => q.project_id === p.id && q.status === 'open' && ['High', 'Critical'].includes(q.severity)).length;
      return n ? [`${n} open High or Critical problem${n === 1 ? '' : 's'}`] : [];
    }
    if (gate === 'client_signoff'){
      const r = latestSignoff(p, x.key);
      if (!r || r.status === 'draft') return ['Sign-off package not sent to the client yet'];
      if (r.status === 'sent') return [`Waiting for client sign-off on version ${r.version}, sent ${fmtDay(r.sent_at)}`];
      if (r.status === 'changes_requested') return [`The client asked for changes on version ${r.version}; prepare version ${r.version + 1}`];
      return [];
    }
    if (gate in PLACEHOLDERS) return hasException(p, x.key, gate) ? []
      : [`${PLACEHOLDERS[gate]} is not built in SiteFlow yet. An Admin or Team Lead can record an exception with a reason.`];
    return [];
  }
  const gateReasons = (p, x) => x.gates.flatMap(g => oneGate(p, x, g));
  function evaluateStages(p){
    const out = {};
    FLOW.forEach(x => {
      const st = p.stages[x.key].status;
      if (DONE.includes(st)) out[x.key] = {state: st, reasons: []};
      else if (st === 'locked'){
        const waiting = x.predecessors.filter(k => !DONE.includes(p.stages[k].status)).map(k => BYKEY[k].label);
        out[x.key] = {state: 'locked', reasons: waiting.length ? [`Waiting for: ${waiting.join(', ')}`] : []};
      } else { const reasons = gateReasons(p, x); out[x.key] = {state: reasons.length ? 'blocked' : 'active', reasons}; }
    });
    return out;
  }
  function releaseStages(p, actor){
    FLOW.filter(x => p.stages[x.key].status === 'locked' && x.predecessors.every(k => DONE.includes(p.stages[k].status))).forEach(x => {
      Object.assign(p.stages[x.key], {status: 'active', started_at: now()});
      audit(p, actor, 'stage.activated', {stage: x.label, key: x.key});
      if (x.owner_role !== 'client'){
        const users = x.owner_role === 'team_lead' ? leads() : p.members.map(user).filter(m => m && m.role === x.owner_role);
        send(users, 'stage_ready', p, `${x.label} is open on ${p.name}.`, actor);
      }
    });
  }
  function completeStage(p, key, actor, note){
    const at = now(), files = stageFiles(p, key).filter(a => !a.completed_at);
    files.forEach(a => { a.completed_at = at; });
    Object.assign(p.stages[key], {status: 'completed', completed_at: at, completed_by: actor ? actor.id : null, note});
    audit(p, actor, 'stage.completed', {stage: BYKEY[key].label, key, note, files: files.map(a => a.filename)});
    releaseStages(p, actor);
  }
  function stageSummary(p){
    if (!p.stages) return {phase: null, current_stages: [], stage_progress: null};
    const open = FLOW.filter(x => p.stages[x.key].status === 'active');
    const done = FLOW.filter(x => DONE.includes(p.stages[x.key].status)).length;
    const n = open.length ? Math.min(...open.map(x => x.phase)) : (done === FLOW.length ? T.phases[T.phases.length - 1].number : null);
    const phase = T.phases.find(ph => ph.number === n);
    return {phase: phase ? {...phase} : null, current_stages: open.map(x => x.label), stage_progress: {done, total: FLOW.length}};
  }
  const KIND_NAMES = {photo: 'photo', video: 'video', document: 'document (PDF)', cad: 'AutoCAD drawing'};
  const evidenceMissing = (x, files) => { const have = new Set(files.map(a => a.kind)); return (x.evidence_required || []).filter(k => !have.has(k)); };
  const evidenceReason = miss => miss.length ? 'Add at least one ' + miss.map(k => KIND_NAMES[k]).join(' and one ') + ' before completing this stage' : null;
  const mayAttach = (u, x, status) => (u.role === x.owner_role || STAFF_COMPLETERS.includes(u.role)) && !isSignoff(x) && ['active', 'historical'].includes(status);
  function stageView(p, u){
    const view = evaluateStages(p);
    const out = x => {
      const r = p.stages[x.key], v = view[x.key], req = latestSignoff(p, x.key), files = stageFiles(p, x.key);
      const miss = r.status === 'active' ? evidenceMissing(x, files) : [];
      return {key: x.key, number: x.number, label: x.label, detail: x.detail, prd_stage: x.prd_stage, workstream: x.workstream, owner_role: x.owner_role,
        gates: x.gates, icon: x.icon, state: v.state, reasons: v.reasons,
        can_complete: v.state === 'active' && !isSignoff(x) && (u.role === x.owner_role || STAFF_COMPLETERS.includes(u.role)),
        started_at: r.started_at, completed_at: r.completed_at, completed_by: brief(user(r.completed_by)), completion_note: r.note,
        historical: r.status === 'historical' ? {label: HISTORICAL_LABEL, confirmed_by: r.hist_by, note: r.hist_note} : null,
        signed_by_client: !!(req && req.status === 'approved' && r.status === 'completed'),
        exceptions: (p.exceptions || []).filter(e => e.stage_key === x.key).map(e => ({gate: e.gate, reason: e.reason, by: brief(user(e.by)), at: e.at})),
        open_exceptions: ['active', 'blocked'].includes(v.state) ? x.gates.filter(g => g in PLACEHOLDERS && !hasException(p, x.key, g)) : [],
        can_record_exception: T.exception_roles.includes(u.role),
        attachments: files.map(attachmentOut), can_attach: mayAttach(u, x, r.status),
        evidence_required: x.evidence_required || [], evidence_missing: miss, evidence_reason: evidenceReason(miss)};
    };
    return {phases: T.phases.map(ph => ({...ph, stages: FLOW.filter(x => x.phase === ph.number).map(out)})),
      current_stages: FLOW.filter(x => ['active', 'blocked'].includes(view[x.key].state)).map(x => x.label),
      stage_progress: {done: FLOW.filter(x => DONE.includes(view[x.key].state)).length, total: FLOW.length}, flow_version: 1};
  }
  function completeStageOp(u, pid, key, note){
    const p = project(u, pid), x = BYKEY[key];
    if (!x) fail(404, 'Stage not found');
    const v = evaluateStages(p)[key];
    if (isSignoff(x)) fail(409, 'This stage completes when the client approves the sign-off package', {reasons: v.reasons});
    if (u.role !== x.owner_role && !STAFF_COMPLETERS.includes(u.role)) fail(403, 'Your role cannot complete this stage');
    if (v.state !== 'active') fail(409, DONE.includes(v.state) ? 'This stage is already completed' : 'This stage cannot be completed yet', {reasons: v.reasons});
    const miss = evidenceMissing(x, stageFiles(p, key).filter(a => !a.completed_at));
    if (miss.length) fail(422, evidenceReason(miss), {missing: ['attachments']});
    note = (note || '').trim();
    if (!note) fail(422, 'Add a note on what was completed', {missing: ['note']});
    completeStage(p, key, u, note);
    return stageView(p, u);
  }
  const constructionStarted = p => ['active', 'completed', 'historical'].includes(p.stages[CONSTRUCTION_START].status);
  function requireSiteVisitOpen(p){
    if (!constructionStarted(p)) fail(409, 'Site visits open once Site line-out (stage 14) has started');
    if (step(p, 2).status !== 'active') fail(409, 'Site Visit step is not open for this project');
  }

  /* ---------- clients and invites (mirror routers/invites.py and /auth/activate) ---------- */
  const clientsOf = p => p.members.map(user).filter(m => m && m.role === 'client');
  const clientOut = c => ({id: c.id, name: c.name, email: c.email, status: c.active === false ? 'invited' : 'active'});
  const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function invite(u, pid, b){
    role(u, 'architect');
    const p = project(u, pid), name = (b.name || '').trim(), email = (b.email || '').trim().toLowerCase();
    if (!name) fail(422, 'name must not be blank');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) fail(422, 'email must be an email address');
    let c = db.users.find(x => x.email === email);
    if (c && c.role !== 'client') fail(409, 'This email belongs to a SiteFlow team member');
    if (!c){ c = {id: nextId('user'), name, email, role: 'client', active: false}; db.users.push(c); }
    if (!p.members.includes(c.id)) p.members.push(c.id);
    let code = null, expires = null;
    if (c.active === false){
      db.invites.filter(i => i.user_id === c.id && !i.used_at).forEach(i => { i.revoked_at = now(); });
      const bytes = crypto.getRandomValues(new Uint8Array(8));
      code = Array.from(bytes, n => ALPHABET[n % ALPHABET.length]).join('');
      expires = new Date(Date.now() + T.signoff.invite_ttl_days * 864e5).toISOString();
      db.invites.push({id: nextId('invite'), user_id: c.id, project_id: p.id, code, expires_at: expires, attempts: 0, used_at: null, revoked_at: null});
    }
    audit(p, u, 'client.invited', {client: c.name, new_code: code !== null});
    return {client: clientOut(c), code, expires_at: expires};
  }
  function activate(email, code, password){
    if (String(password || '').length < 10) fail(422, 'Choose a password of at least 10 characters', {missing: ['password']});
    const invalid = 'This invite code is not valid. Ask your architect for a new one.';
    const c = db.users.find(x => x.email === String(email).trim().toLowerCase() && x.role === 'client');
    const inv = c && db.invites.filter(i => i.user_id === c.id && !i.used_at && !i.revoked_at).pop();
    if (!inv || inv.attempts >= T.signoff.invite_max_attempts || Date.parse(inv.expires_at) < Date.now()) fail(400, invalid);
    if (String(code).trim().toUpperCase() !== inv.code){ inv.attempts += 1; fail(400, invalid); }
    Object.assign(c, {active: true, password});  // demo only: kept in this browser's storage
    inv.used_at = now();
    audit(byId(db.projects, inv.project_id), c, 'client.activated', {});
    store.set(K_TOKEN, String(c.id));
    return {id: c.id, name: c.name, email: c.email, role: c.role};
  }

  /* ---------- sign-off packages (mirror routers/signoffs.py and routers/client.py) ---------- */
  const SIGNOFF_LABEL = key => BYKEY[key].label;
  function signoffOut(r){
    return {id: r.id, project_id: r.project_id, stage_key: r.stage_key, stage: SIGNOFF_LABEL(r.stage_key), version: r.version,
      status: r.status, title: r.title, summary: r.summary, created_by: brief(user(r.created_by)), created_at: r.created_at,
      sent_at: r.sent_at, responded_at: r.responded_at, response_comment: r.response_comment, signer_name: r.signer_name,
      signed_by: brief(user(r.signer_id)), method: r.method, supersedes_id: r.supersedes_id,
      attachments: r.attachments.map(a => ({id: a.id, filename: a.filename, content_type: a.content_type, size: a.size, uploaded_at: a.uploaded_at}))};
  }
  function clientSignoffOut(r, u){
    const viewed = new Set(r.views.filter(v => v.user_id === u.id).map(v => v.attachment_id));
    const p = byId(db.projects, r.project_id);
    return {id: r.id, project: {id: p.id, name: p.name}, stage_key: r.stage_key, stage: SIGNOFF_LABEL(r.stage_key), version: r.version,
      status: r.status, title: r.title, summary: r.summary, sent_at: r.sent_at, responded_at: r.responded_at,
      response_comment: r.response_comment, signer_name: r.signer_name, confirmation_text: T.signoff.confirmation_text,
      can_respond: r.status === 'sent',
      attachments: r.attachments.map(a => ({id: a.id, filename: a.filename, content_type: a.content_type, size: a.size,
        uploaded_at: a.uploaded_at, viewed: viewed.has(a.id)}))};
  }
  function editableSignoff(u, id){
    role(u, 'architect');
    const r = byId(db.signoffs, id);
    if (!r || !visible(u).some(p => p.id === r.project_id)) fail(404, 'Sign-off not found');
    if (r.status !== 'draft') fail(409, `Version ${r.version} was ${r.status} and can no longer change`);
    return r;
  }
  function createSignoff(u, pid, b){
    role(u, 'architect');
    const p = project(u, pid);
    if (!BYKEY[b.stage_key] || !isSignoff(BYKEY[b.stage_key])) fail(422, 'stage_key must be a client sign-off stage');
    if (p.stages[b.stage_key].status !== 'active') fail(409, `${SIGNOFF_LABEL(b.stage_key)} is not open yet`);
    const history = db.signoffs.filter(r => r.project_id === p.id && r.stage_key === b.stage_key);
    if (history.some(r => ['draft', 'sent'].includes(r.status))) fail(409, 'This stage already has a package in progress');
    const title = (b.title || '').trim(), summary = (b.summary || '').trim();
    if (!title || !summary) fail(422, 'title and summary must not be blank');
    const prev = history.sort((a, c) => a.version - c.version).pop();
    const r = {id: nextId('signoff'), project_id: p.id, stage_key: b.stage_key, version: prev ? prev.version + 1 : 1, status: 'draft',
      title, summary, created_by: u.id, created_at: now(), sent_at: null, responded_at: null, response_comment: null,
      signer_id: null, signer_name: null, method: null, supersedes_id: prev ? prev.id : null, attachments: [], views: []};
    db.signoffs.push(r);
    audit(p, u, 'signoff.created', {stage: SIGNOFF_LABEL(r.stage_key), version: r.version});
    return r;
  }
  function sendSignoff(u, id){
    const r = editableSignoff(u, id), p = byId(db.projects, r.project_id);
    const missing = [...(r.attachments.length ? [] : ['attachments']), ...(clientsOf(p).length ? [] : ['client'])];
    if (missing.length) fail(422, 'Add at least one document and invite the client before sending', {missing});
    Object.assign(r, {status: 'sent', sent_at: now()});
    audit(p, u, 'signoff.sent', {stage: SIGNOFF_LABEL(r.stage_key), version: r.version});
    send(clientsOf(p), 'signoff_requested', p, `Please review and sign off: ${SIGNOFF_LABEL(r.stage_key)} (version ${r.version}) on ${p.name}.`, u);
    syncFlags(p);
    return r;
  }
  const myProjectIds = u => db.projects.filter(p => p.members.includes(u.id)).map(p => p.id);
  function myRequest(u, id){
    const r = byId(db.signoffs, id);
    if (!r || r.status === 'draft' || !myProjectIds(u).includes(r.project_id)) fail(404, 'Sign-off not found');
    return r;
  }
  const norm = n => String(n || '').replace(/\s+/g, ' ').trim().toLowerCase();
  function approveSignoff(u, id, name){
    const r = myRequest(u, id), p = byId(db.projects, r.project_id);
    if (r.status !== 'sent') fail(409, `Version ${r.version} has already been answered`);
    const viewed = new Set(r.views.filter(v => v.user_id === u.id).map(v => v.attachment_id));
    const unviewed = r.attachments.filter(a => !viewed.has(a.id)).map(a => a.filename);
    const invalid = norm(name) && norm(name) === norm(u.name) ? [] : ['signer_name'];
    if (unviewed.length || invalid.length) fail(422, 'Open every document, tick the confirmation and type your full name to sign off',
      {missing: unviewed.length ? ['attachments'] : [], invalid, unviewed});
    Object.assign(r, {status: 'approved', responded_at: now(), signer_id: u.id, signer_name: String(name).trim(), method: 'client_app'});
    audit(p, u, 'signoff.approved', {stage: SIGNOFF_LABEL(r.stage_key), version: r.version, signer: r.signer_name});
    completeStage(p, r.stage_key, u, `Signed off by ${r.signer_name} in the client app (version ${r.version}).`);
    send([architectOf(p), ...leads()], 'signoff_answered', p, `${r.signer_name} signed off ${SIGNOFF_LABEL(r.stage_key)} (version ${r.version}) on ${p.name}.`, u);
    syncFlags(p);
    return r;
  }
  function requestChanges(u, id, comment){
    const r = myRequest(u, id), p = byId(db.projects, r.project_id);
    if (r.status !== 'sent') fail(409, `Version ${r.version} has already been answered`);
    comment = (comment || '').trim();
    if (!comment) fail(422, 'Say what should change', {missing: ['comment']});
    Object.assign(r, {status: 'changes_requested', responded_at: now(), signer_id: u.id, response_comment: comment, method: 'client_app'});
    audit(p, u, 'signoff.changes_requested', {stage: SIGNOFF_LABEL(r.stage_key), version: r.version, comment});
    send([architectOf(p), ...leads()], 'signoff_answered', p, `${u.name} asked for changes on ${SIGNOFF_LABEL(r.stage_key)} (version ${r.version}) on ${p.name}: ${comment}`, u);
    syncFlags(p);
    return r;
  }
  const fileAsDataUrl = file => new Promise((resolve, reject) => {
    const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.onerror = () => reject(new ApiError(415, 'The file could not be read')); fr.readAsDataURL(file);
  });

  /* ---------- the client's view (mirrors services/client_view.py: allow-listed fields only) ---------- */
  const CLIENT_STATE = {completed: 'completed', historical: 'historical', active: 'in_progress', locked: 'upcoming'};
  function clientCard(p){
    const st = stageSummary(p);
    return {id: p.id, name: p.name, location: p.location, phase: st.phase, current_stages: st.current_stages,
      stage_progress: st.stage_progress, official_progress: p.official_progress,
      waiting_for_you: db.signoffs.filter(r => r.project_id === p.id && r.status === 'sent').length};
  }
  function clientDetail(p, u){
    const shared = db.signoffs.filter(r => r.project_id === p.id && r.status !== 'draft');
    const approved = Object.fromEntries(shared.filter(r => r.status === 'approved').map(r => [r.stage_key, r]));
    return {...clientCard(p),
      phases: T.phases.map(ph => ({number: ph.number, name: ph.name, icon: ph.icon, stages: FLOW.filter(x => x.phase === ph.number).map(x => {
        const r = p.stages[x.key], signed = r.status === 'completed' ? approved[x.key] : null;
        return {key: x.key, number: x.number, label: x.label, icon: x.icon, detail: x.detail, workstream: x.workstream, state: CLIENT_STATE[r.status],
          is_signoff: isSignoff(x), started_at: r.started_at, completed_at: r.completed_at,
          historical: r.status === 'historical' ? 'Completed before SiteFlow' : null,
          signed: signed ? {by: signed.signer_name, at: signed.responded_at, version: signed.version} : null};
      })})),
      signoffs: shared.map(r => clientSignoffOut(r, u)),
      shared_updates: db.updates.filter(x => x.project_id === p.id).slice().reverse().map(x => ({id: x.id, note: x.note, shared_at: x.created_at,
        stage: (byId(db.visits, x.visit_id) || {}).current_stage || null,
        photos: x.photo_ids.map(mid => ({id: mid, captured_at: (byId(db.media, mid) || {}).captured_at || null}))}))};
  }

  /* ---------- shared site updates (mirror routers/updates.py) ---------- */
  function shareUpdate(u, vid, note, ids){
    role(u, 'architect', 'team_lead');
    const v = visibleVisit(u, vid);
    if (v.status !== 'approved') fail(409, 'Only approved visits can be shared with the client');
    note = (note || '').trim();
    const photos = mediaOf(v).filter(m => m.kind === 'photo').map(m => m.id);
    const invalid = (ids || []).filter(i => !photos.includes(i)).map(i => `media_ids.${i}`);
    if (!note || invalid.length) fail(422, 'Write a note, and pick photos from this visit only', {missing: note ? [] : ['note'], invalid});
    const p = byId(db.projects, v.project_id);
    const x = {id: nextId('update'), project_id: p.id, visit_id: v.id, note, shared_by: u.id, created_at: now(), photo_ids: [...new Set(ids || [])]};
    db.updates.push(x);
    audit(p, u, 'update.shared', {visit_id: v.id, photos: x.photo_ids.length});
    send(clientsOf(p), 'update_shared', p, `Your architect shared a site update on ${p.name}.`, u);
    return {id: x.id, visit_id: x.visit_id, note: x.note, shared_at: x.created_at, shared_by: brief(u), photo_ids: x.photo_ids};
  }

  /* ---------- workflow health (mirrors modules/workflow/health.py) ---------- */
  // Which stage each red flag rule delays; client_decision_overdue names its sign-off.
  const FLAG_STAGE = {legal_delay: 'line_out', critical_issue: 'construction', overdue_fix: 'construction',
    review_overdue: 'construction', repeated_rework: 'construction', no_recent_visit: 'construction'};
  function phaseHealth(items){
    const kinds = new Set(items.map(i => i.health));
    if (kinds.has('delayed')) return 'delayed';
    if (kinds.has('waiting')) return 'waiting';
    if (kinds.size === 1 && kinds.has('done')) return 'done';
    if (kinds.size === 1 && kinds.has('upcoming')) return 'upcoming';
    return 'waiting';
  }
  function projectHealth(p){
    if (!p.stages) return null;
    const view = evaluateStages(p), flagged = {};
    db.flags.filter(f => f.project_id === p.id && !f.cleared_at).forEach(f => {
      let key = FLAG_STAGE[f.rule];
      if (f.rule === 'client_decision_overdue' && f.key.startsWith('signoff-')) key = (byId(db.signoffs, f.key.split('-')[1]) || {}).stage_key;
      if (key && !(key in flagged)) flagged[key] = RULES[f.rule].label;
    });
    const counts = {done: 0, waiting: 0, delayed: 0, upcoming: 0};
    const one = x => {
      const {state, reasons} = view[x.key];
      let health, reason = null;
      if (DONE.includes(state)){ health = 'done'; reason = state === 'historical' ? 'Completed before SiteFlow' : 'Completed'; }
      else if (x.key in flagged){ health = 'delayed'; reason = flagged[x.key]; }
      else if (state === 'active' || state === 'blocked'){ health = 'waiting'; reason = reasons[0] || 'In progress'; }
      else health = 'upcoming';
      counts[health] += 1;
      return {key: x.key, number: x.number, label: x.label, icon: x.icon, health, reason};
    };
    const phases = T.phases.map(ph => { const items = FLOW.filter(x => x.phase === ph.number).map(one);
      return {number: ph.number, name: ph.name, icon: ph.icon, health: phaseHealth(items), stages: items}; });
    return {phases, counts};
  }

  /* ---------- recorded exceptions (mirror modules/workflow/exceptions.py) ---------- */
  function recordException(u, pid, key, gate, reason){
    const p = project(u, pid), x = BYKEY[key];
    if (!x) fail(404, 'Stage not found');
    if (!T.exception_roles.includes(u.role)) fail(403, 'Your role cannot record exceptions');
    if (!x.gates.includes(gate) || !(gate in PLACEHOLDERS)) fail(422, "Exceptions can be recorded only for this stage's placeholder checks", {invalid: ['gate']});
    reason = (reason || '').trim();
    if (!reason) fail(422, 'Give the reason for the exception', {missing: ['reason']});
    if (DONE.includes(p.stages[key].status)) fail(409, 'This stage is already completed');
    if (hasException(p, key, gate)) fail(409, 'An exception is already recorded for this check');
    p.exceptions = p.exceptions || [];
    p.exceptions.push({stage_key: key, gate, reason, by: u.id, at: now()});
    audit(p, u, 'stage.exception_recorded', {stage: x.label, key, gate, reason});
    return {stage_key: key, gate, reason, by: brief(u), at: now()};
  }

  /* ---------- stage files (mirror modules/workflow/attachments.py) ---------- */
  const stageFiles = (p, key) => (p.files || []).filter(a => a.stage_key === key);
  const attachmentOut = a => ({id: a.id, kind: a.kind, filename: a.filename, content_type: a.content_type, size: a.size,
    uploaded_by: brief(user(a.uploaded_by)), uploaded_at: a.uploaded_at, completed_at: a.completed_at});
  const EXT_KIND = {jpg: 'photo', jpeg: 'photo', png: 'photo', webp: 'photo', mp4: 'video', mov: 'video', webm: 'video', pdf: 'document', dwg: 'cad', dxf: 'cad'};
  const EXT_TYPE = {jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/jpeg', webp: 'image/jpeg', mp4: 'video/mp4', mov: 'video/quicktime',
    webm: 'video/webm', pdf: 'application/pdf', dwg: 'application/acad', dxf: 'application/dxf'};
  const extOf = name => (String(name || '').split('.').pop() || '').toLowerCase();
  async function signatureOk(file, kind){
    if (kind === 'photo' || kind === 'video') return true;  // photos are re-drawn below; a bad one fails to load
    const head = new Uint8Array(await file.slice(0, 1024).arrayBuffer()), text = String.fromCharCode(...head);
    if (kind === 'document') return text.startsWith('%PDF');
    return extOf(file.name) === 'dwg' ? text.startsWith('AC10') : /(^|\n)\s*0\s*\r?\n\s*SECTION/.test(text);
  }

  /* ---------- project image (mirrors modules/projects/image.py) ---------- */
  const imageOut = p => p.image ? {thumb_url: `/projects/${p.id}/image?size=thumb`, updated_at: p.image.updated_at} : null;

  /* ---------- fee plan and the interim fee ledger (mirror modules/projects/fee_plan.py, modules/fees/ledger.py) ---------- */
  const money2 = n => (Math.round(n * 100) / 100).toFixed(2);
  const feePlanOut = p => ({contract_value: p.fee_plan && p.fee_plan.contract_value != null ? money2(p.fee_plan.contract_value) : null,
    currency: (p.fee_plan && p.fee_plan.currency) || 'INR', fee_basis: (p.fee_plan || {}).fee_basis || null, fee_notes: (p.fee_plan || {}).fee_notes || null});
  function updateFeePlan(u, pid, b){
    role(u, 'architect', 'admin', 'accounts');
    const p = project(u, pid), f = {...feePlanOut(p)}, changes = {};
    if ('contract_value' in b){
      const v = b.contract_value === null || b.contract_value === '' ? null : Number(b.contract_value);
      if (v !== null && (!isFinite(v) || v < 0)) fail(422, 'Give the contract value as a number of 0 or more', {invalid: ['contract_value']});
      changes.contract_value = v;
    }
    if ('currency' in b){ const c = String(b.currency || 'INR').trim().toUpperCase(); if (!/^[A-Z]{3}$/.test(c)) fail(422, 'Currency is a 3-letter code such as INR', {invalid: ['currency']}); changes.currency = c; }
    ['fee_basis', 'fee_notes'].forEach(k => { if (k in b) changes[k] = (b[k] || '').trim() || null; });
    p.fee_plan = {...(p.fee_plan || {}), ...changes};
    audit(p, u, 'fee_plan.updated', {changes: Object.fromEntries(Object.keys(changes).map(k => [k, [f[k], changes[k]]]))});
    return feePlanOut(p);
  }
  const mayUseFees = u => u.role === 'accounts' || !!u.principal;
  function feeTotals(p){
    let due = 0, received = 0;
    (p.fees || []).forEach(e => { if (e.kind === 'due') due += e.amount; else received += e.amount; });
    return {due: money2(due), received: money2(received), outstanding: money2(due - received), currency: feePlanOut(p).currency};
  }
  const feeEntryOut = (p, e) => ({id: e.id, kind: e.kind, amount: money2(e.amount), currency: feePlanOut(p).currency, date: e.date,
    reference: e.reference, note: e.note, recorded_by: brief(user(e.recorded_by)), recorded_at: e.recorded_at});
  function feeLedger(u, pid){
    if (!mayUseFees(u)) fail(403, 'Only Accounts and the principal architect see client fees');
    const p = project(u, pid);
    return {entries: (p.fees || []).slice().sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).map(e => feeEntryOut(p, e)), totals: feeTotals(p)};
  }
  function recordFee(u, pid, b){
    if (!mayUseFees(u)) fail(403, 'Only Accounts and the principal architect see client fees');
    const p = project(u, pid), amount = Number(b.amount), reference = (b.reference || '').trim() || null, note = (b.note || '').trim() || null;
    if (!['due', 'received'].includes(b.kind)) fail(422, 'Type must be a fee due or a payment received', {invalid: ['kind']});

        fees: feeTotals(p),

  /* ---------- Admin: team, memberships and project import (mirror modules/identity/admin.py, modules/projects/importer.py) ---------- */
  const STAFF_ROLES = ['architect', 'team_lead', 'civil_engineer', 'admin', 'structural_consultant', 'mep_consultant', 'interior_designer', 'accounts', 'office_coordinator'];
  function createUser(u, b){
    role(u, 'admin');
    const name = (b.name || '').trim(), email = (b.email || '').trim().toLowerCase();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !STAFF_ROLES.includes(b.role))
      fail(422, 'Give a name, an email address and a staff role', {invalid: [...(name ? [] : ['name']), ...(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? [] : ['email']), ...(STAFF_ROLES.includes(b.role) ? [] : ['role'])]});
    if (db.users.some(x => x.email === email)) fail(409, 'A user with this email already exists');
    const temporary = Array.from(crypto.getRandomValues(new Uint8Array(9)), n => ALPHABET[n % ALPHABET.length]).join('');
    const nu = {id: nextId('user'), name, email, role: b.role, password: temporary};  // demo only: kept in this browser

  function updateUser(u, id, b){
    role(u, 'admin');

    if (t.role === 'client') fail(409, 'Client accounts are managed through the project invite');
    if (t.id === u.id && ((b.role && b.role !== t.role) || b.active === false)) fail(409, "You can't change your own role or deactivate yourself");
    if (b.role && !STAFF_ROLES.includes(b.role)) fail(422, "A staff user can't become a client");
    if (b.role) t.role = b.role;
    if (b.active !== undefined && b.active !== null) t.active = !!b.active;
    if (b.principal !== undefined && b.principal !== null){ if (b.principal && t.active === false) fail(409, 'Only an active staff user can be the principal architect'); t.principal = !!b.principal; }

  function addMember(u, pid, uid){

  const IMPORT_COLUMNS = ['project_name', 'location', 'client_name', 'client_email', 'site_address', 'current_stage', 'civil_engineer_email', 'confirmed_by', 'legal_expected_date'];
  const IMPORT_REQUIRED = ['project_name', 'location', 'civil_engineer_email'];
  const IMPORT_EXAMPLE = 'Mane Villa,Wakad Pune,Mane family,mane@example.com,Survey 8 Wakad,grid,engineer@siteflow.demo,Parvez,';
  function csvRows(text){
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (q){ if (c === '"' && text[i + 1] === '"'){ cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
      else if (c === '"') q = true;
      else if (c === ','){ row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim()));
  }
  function parseImport(text){
    const [head, ...body] = csvRows(text.replace(/^\ufeff/, ''));
    const header = (head || []).map(h => h.trim()), missing = IMPORT_COLUMNS.filter(c => !header.includes(c));
    if (missing.length) fail(422, "The file needs the template's columns", {missing});
    if (body.length > 500) fail(422, 'Import at most 500 projects at a time');
    const engineers = Object.fromEntries(db.users.filter(x => x.role === 'civil_engineer' && x.active !== false).map(x => [x.email, x]));
    const existing = new Set(db.projects.map(p => p.name.toLowerCase())), seen = {};
    return body.map((cells, n) => {
      const values = Object.fromEntries(IMPORT_COLUMNS.map(c => [c, (cells[header.indexOf(c)] || '').trim()])), errors = [], at = n + 2;
      IMPORT_COLUMNS.forEach(c => { if (/^[=+\-@]/.test(values[c])) errors.push(`${c} starts with = + - or @`); });
      IMPORT_REQUIRED.forEach(c => { if (!values[c]) errors.push(`${c} is required`); });
      const st = values.current_stage;
      if (st){
        if (!BYKEY[st]) errors.push(`current_stage '${st}' is not a stage`);
        else if (st === FLOW[0].key) errors.push(`current_stage '${st}' is the first stage; leave it blank for a new project`);
        if (!values.confirmed_by) errors.push('confirmed_by is required when current_stage is set');
      }
      if (values.civil_engineer_email && !engineers[values.civil_engineer_email.toLowerCase()]) errors.push('civil_engineer_email is not an active Civil Engineer');
      if (values.client_email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(values.client_email)) errors.push('client_email is not an email address');
      if (values.legal_expected_date && (!/^\d{4}-\d{2}-\d{2}$/.test(values.legal_expected_date) || isNaN(Date.parse(values.legal_expected_date)))) errors.push('legal_expected_date must be YYYY-MM-DD');
      const name = values.project_name.toLowerCase();
      if (name){ if (name in seen) errors.push(`project_name repeats row ${seen[name]}`); else seen[name] = at;
        if (existing.has(name)) errors.push(`a project named '${values.project_name}' already exists`); }
      return {row: at, ok: !errors.length, errors, values, engineer: engineers[values.civil_engineer_email.toLowerCase()] || null};
    });
  }
  const importRowOut = r => ({row: r.row, ok: r.ok, errors: r.errors, values: r.values});
  const importCounts = rs => ({rows: rs.length, ok: rs.filter(r => r.ok).length, errors: rs.filter(r => !r.ok).length});
  async function readImportFile(file){

    db.batches = db.batches || []; db.batches.push(batch);
    if (mode === 'all_or_nothing' && counts.errors) fail(422, 'Nothing was imported: fix the rows with errors, or import the valid rows only', {counts, rows: rs.map(importRowOut), batch_id: batch.id});
    const made = rs.filter(r => r.ok).map(r => {
      const v = r.values, p = createProject(arch, {name: v.project_name, location: v.location, civil_engineer_id: r.engineer.id, legal_expected_date: v.legal_expected_date || null,
