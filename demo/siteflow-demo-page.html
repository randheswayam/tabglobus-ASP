<title>SiteFlow Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#ECEEEA; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#1B2428; --ink-2:#56625F; --ink-3:#7F8A87;
  --line:#D5DAD4; --line-2:#E4E7E2;
  --accent:#0E6B6F; --accent-2:#0A5558; --accent-ink:#FFFFFF; --accent-soft:#DCECEA;
  --hivis:#D99613; --hivis-soft:#FBF0D6;
  --ok:#2E7A4D; --ok-soft:#DDEFE3; --warn:#A8660F; --warn-soft:#F8E9D0; --bad:#B42318; --bad-soft:#F9E0DC;
  --shadow:0 1px 2px rgba(20,35,38,.06),0 4px 14px rgba(20,35,38,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111719; --surface:#192124; --surface-2:#1F292C; --ink:#E5EBE8; --ink-2:#9DAAA6; --ink-3:#72807C;
    --line:#2D393C; --line-2:#253033;
    --accent:#4CB2AE; --accent-2:#6CC7C3; --accent-ink:#08191A; --accent-soft:#1B3637;
    --hivis:#EDB23D; --hivis-soft:#3A2F17;
    --ok:#5DBB82; --ok-soft:#18342A; --warn:#E3A948; --warn-soft:#3A2D16; --bad:#F2786D; --bad-soft:#3D1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111719; --surface:#192124; --surface-2:#1F292C; --ink:#E5EBE8; --ink-2:#9DAAA6; --ink-3:#72807C;
  --line:#2D393C; --line-2:#253033;
  --accent:#4CB2AE; --accent-2:#6CC7C3; --accent-ink:#08191A; --accent-soft:#1B3637;
  --hivis:#EDB23D; --hivis-soft:#3A2F17;
  --ok:#5DBB82; --ok-soft:#18342A; --warn:#E3A948; --warn-soft:#3A2D16; --bad:#F2786D; --bad-soft:#3D1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-2)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.whois{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.whois select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:13px}
.credit{font-size:10.5px;color:var(--ink-3);padding:0 6px;letter-spacing:.04em}

main{min-width:0;padding-inline:32px;padding-block:24px 48px}
.mtop,.tabs{display:none}
.offline{display:flex;gap:8px;align-items:center;background:var(--hivis-soft);color:var(--warn);border:1px solid var(--hivis);padding:8px 12px;border-radius:8px;margin-bottom:16px;font-weight:500}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{color:var(--ink-2);margin-top:4px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.5px;margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--ink-2);font-size:12.5px}
.kpi.alert b{color:var(--bad)}
.kpi.attn b{color:var(--hivis)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.pill.active{background:var(--hivis-soft);color:var(--warn);border-color:transparent}
.pill.submitted,.pill.review{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.rework,.pill.overdue{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* task list */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task .ti{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.task-capture .ti{background:var(--hivis-soft);color:var(--warn)}
.task-review .ti{background:var(--accent-soft);color:var(--accent-2)}
.task b{font-weight:600;display:block}
.task .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:22px 16px;color:var(--ink-2);text-align:center}

/* project cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.pcard:hover{border-color:var(--accent)}
.pcard h3{font-size:16px}
.pcard .loc{font-size:12.5px;color:var(--ink-2)}
.ministep{display:flex;gap:4px}
.ministep i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ministep i.done{background:var(--ok)}
.ministep i.active,.ministep i.rework{background:var(--hivis)}
.ministep i.submitted{background:var(--accent)}
.pcard .now{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}

/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.fi:last-child{border-bottom:0}
.fi .fic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.fi .fic svg{width:15px;height:15px}
.fi.ok .fic{background:var(--ok-soft);color:var(--ok)}
.fi.warn .fic{background:var(--bad-soft);color:var(--bad)}
.fi.ms .fic{background:var(--hivis-soft);color:var(--warn)}
.fi.unread{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.fi .when{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ch{font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink-3)}

/* stepper */
.stepper-wrap{overflow-x:auto;margin-bottom:20px}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:0;min-width:min-content}
.st{flex:1;min-width:150px;position:relative}
.st button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px 12px 0;border:0;background:none;text-align:left}
.st::before{content:"";position:absolute;top:26px;left:30px;right:0;height:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.st-done::before{background:var(--ok)}
.st-n{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--ink-3)}
.st-done .st-n{background:var(--ok);border-color:var(--ok);color:#fff}
.st-active .st-n,.st-rework .st-n{border-color:var(--hivis);color:var(--warn);background:var(--hivis-soft)}
.st-submitted .st-n{border-color:var(--accent);color:var(--accent)}
.st-n svg{width:15px;height:15px;stroke-width:2.6}
.st-l{font-weight:600;font-size:13.5px;padding-right:10px}
.st-s{font-size:12px;color:var(--ink-2)}

.steps{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.scard.cur{border-color:var(--hivis);box-shadow:inset 3px 0 0 var(--hivis)}
.scard .who{font-size:12.5px;color:var(--ink-2)}
.branches{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.branch{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.thumbs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.team{display:flex;flex-direction:column;gap:8px}
.person{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.audit{display:flex;flex-direction:column;gap:10px;font-size:12.5px;max-height:320px;overflow:auto}
.audit div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req{font-size:10.5px;font-weight:600;color:var(--warn);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:14px}
.field textarea{resize:vertical;min-height:76px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.miss input,.field.miss textarea,.field.miss select{border-color:var(--bad)}
.ro{padding:8px 0;white-space:pre-wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.sec-h h3{display:flex;gap:8px;align-items:center}
.sec-b{padding:16px}

.act{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.reqpanel{position:sticky;top:20px}
.reqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.reqlist li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.reqlist .ck{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);margin-top:1px}
.reqlist li.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.reqlist li.ok .ck svg{width:11px;height:11px;stroke-width:3}
.reqlist li.no{color:var(--ink-2)}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .25s}
.errbox{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner.rework{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--accent-2)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.saved{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.ph button svg{width:13px;height:13px}
.addph{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);background:none;font-size:12.5px;font-weight:600;max-width:100%}
.addph:hover{border-color:var(--accent);color:var(--accent)}
.addph svg{width:22px;height:22px}
.pcount{font-family:var(--f-mono);font-size:12.5px}
.ph-tag{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 5px}
.ph-video{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:11.5px;font-weight:600}
.ph-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .2s}
.ph-up{border-style:dashed}
button.ph{padding:0;cursor:zoom-in}
/* dashboard */
.filters{margin-bottom:16px}
.filters summary{cursor:pointer;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.flt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.flt{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.flt input,.flt select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13px;color:var(--ink);width:100%}
.dash-table tr.clickable{cursor:pointer}
.dash-table tr.clickable:hover td{background:var(--surface-2)}
.dash-table td{vertical-align:top;padding:9px 8px}
.attn-row{cursor:default}
.linkish{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);text-align:left}
.linkish:hover{color:var(--accent)}
.flag-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.flag-chip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flag-clear-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.flag-clear-form .inp{flex:1;min-width:160px;padding:6px 9px;font-size:13px}
.major-row{width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left}
.major-row:hover{background:var(--surface-2)}
.major-thumb{width:44px;height:34px;border-radius:5px;overflow:hidden;background:var(--surface-2);display:block}
.major-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.major-row.fi{grid-template-columns:44px minmax(0,1fr)}
.overdue-text{color:var(--bad);font-weight:600}
button.note{width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left}
button.note:hover{background:var(--surface-2)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(10,16,18,.82);display:grid;place-items:center;padding:16px}
.lb-body{max-width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
.lb-body img,.lb-body video{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px;background:#000}
.lb-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;color:#e5ebe8;font-size:13px}
.pcount.short{color:var(--bad)}
.gps{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gps .coord{font-family:var(--f-mono);font-size:13.5px;padding:8px 12px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line-2)}
.media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mbtn{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left}
.mbtn:hover{border-color:var(--accent)}
.mbtn b{font-size:13px}
.mbtn span{font-size:11.5px;color:var(--ink-2)}
.mlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mitem{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 10px;border-radius:6px;background:var(--surface-2)}
.mitem .x{margin-left:auto;border:0;background:none;color:var(--ink-3);padding:2px}

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const DEMO_TEMPLATE = {"id": "residential", "version": 1, "steps": ["Legal Approval", "Site Visit", "Team Lead Review"], "stages": [{"name": "Foundation", "weight": 12.5, "checklist": [{"id": "fdn-excavation", "label": "Excavation to drawing depth"}, {"id": "fdn-pcc", "label": "PCC bed laid"}, {"id": "fdn-footing-rebar", "label": "Footing reinforcement checked"}, {"id": "fdn-footing-concrete", "label": "Footing concrete poured"}]}, {"name": "Plinth", "weight": 12.5, "checklist": [{"id": "pln-beam", "label": "Plinth beam cast"}, {"id": "pln-filling", "label": "Plinth filling and compaction"}, {"id": "pln-dpc", "label": "Damp proof course laid"}]}, {"name": "Superstructure", "weight": 12.5, "checklist": [{"id": "sup-columns", "label": "Columns cast"}, {"id": "sup-beams", "label": "Beams cast"}, {"id": "sup-slab", "label": "Slab cast"}, {"id": "sup-curing", "label": "Curing completed"}]}, {"name": "Masonry", "weight": 12.5, "checklist": [{"id": "msn-walls", "label": "External walls built"}, {"id": "msn-partitions", "label": "Internal partitions built"}, {"id": "msn-lintels", "label": "Lintels and sills cast"}]}, {"name": "Plastering", "weight": 12.5, "checklist": [{"id": "pls-internal", "label": "Internal plaster"}, {"id": "pls-external", "label": "External plaster"}]}, {"name": "Services", "weight": 12.5, "checklist": [{"id": "svc-plumbing", "label": "Plumbing lines laid"}, {"id": "svc-electrical", "label": "Electrical conduits and wiring"}, {"id": "svc-testing", "label": "Pressure and circuit tests"}]}, {"name": "Finishes", "weight": 12.5, "checklist": [{"id": "fin-flooring", "label": "Flooring and tiling"}, {"id": "fin-doors-windows", "label": "Doors and windows fixed"}, {"id": "fin-painting", "label": "Painting"}, {"id": "fin-fixtures", "label": "Fixtures installed"}]}, {"name": "Handover", "weight": 12.5, "checklist": [{"id": "hnd-snag", "label": "Snag list closed"}, {"id": "hnd-cleaning", "label": "Site cleaned"}, {"id": "hnd-documents", "label": "Handover documents ready"}]}], "checklist_states": ["Done", "In progress", "Not started"], "problems": {"Structural": ["Crack in beam, column or slab", "Honeycombing in concrete", "Rebar spacing or cover not per drawing", "Formwork misalignment"], "Quality": ["Poor curing", "Plaster hollowness", "Level or plumb deviation", "Brickwork joint issues"], "Water": ["Seepage or dampness", "Waterproofing defect", "Drainage slope issue"], "Site": ["Material shortage", "Labour shortage", "Equipment breakdown", "Deviation from approved drawing"], "Safety": ["Missing barricading", "No safety gear in use", "Unsafe scaffolding"], "Other": []}, "severities": ["Low", "Medium", "High", "Critical"], "min_photos": 5};
/* ---------- SiteFlow demo API ----------
   Same interface as api.js, but the v1 workflow runs in the browser with sample data, so the
   demo works as a single file with no server. The rules mirror the FastAPI backend: roles and
   project visibility, Legal Approval transitions, mandatory site visit validation, derived
   progress and the Team Lead review. DEMO_TEMPLATE is injected by build.py from
   backend/app/template_config.py, so the stages, checklists and problem list stay in step. */
const SiteFlowAPI = (() => {
  'use strict';
  const T = DEMO_TEMPLATE;
  const K_DB = 'siteflow.demo.db.v1', K_TOKEN = 'siteflow.demo.token';
  const PASSWORD = 'demo';
  const mem = {};
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (_) { return mem[k] ?? null; } },
    set(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { if (v == null) delete mem[k]; else mem[k] = v; } }
  };

  class ApiError extends Error {
    constructor(status, message, detail){ super(message); this.status = status; this.detail = detail; }
    get missing(){ return (this.detail && this.detail.missing) || []; }
    get invalid(){ return (this.detail && this.detail.invalid) || []; }
  }
  const fail = (status, message, extra) => { throw new ApiError(status, message, extra ? {message, ...extra} : message); };

  /* ---------- storage ---------- */
  let db = null, clockOffset = 0, onSignedOut = null;
  const now = () => new Date(Date.now() - clockOffset).toISOString();
  const ymd = daysAgo => { const d = new Date(Date.now() - daysAgo * 864e5); return d.toISOString().slice(0, 10); };
  function load(){ try { db = JSON.parse(store.get(K_DB) || 'null'); } catch (_) { db = null; } if (!db || db.v !== 1) seed(); }
  const save = () => store.set(K_DB, JSON.stringify(db));
  const nextId = kind => (db.seq[kind] = (db.seq[kind] || 0) + 1);
  const user = id => db.users.find(u => u.id === id);
  const brief = u => u ? {id: u.id, name: u.name, role: u.role} : null;

  /* ---------- auth and access ---------- */
  function current(){
    const t = store.get(K_TOKEN), u = t && user(+t);
    if (!u){ store.set(K_TOKEN, null); if (t && onSignedOut) onSignedOut(); fail(401, 'Not authenticated'); }
    return u;
  }
  function role(u, ...roles){ if (!roles.includes(u.role)) fail(403, 'Your role cannot perform this action'); }
  const seesAll = u => u.role === 'architect' || u.role === 'team_lead';
  const visible = u => db.projects.filter(p => seesAll(u) || p.members.includes(u.id));
  function project(u, id){ const p = visible(u).find(x => x.id === +id); if (!p) fail(404, 'Project not found'); return p; }

  /* ---------- workflow ---------- */
  const audit = (p, u, action, detail = {}) => db.audit.push({project_id: p.id, actor_id: u.id, action, detail, at: now()});
  const step = (p, order) => p.steps.find(s => s.order === order);
  function setStep(p, order, status, u){
    const s = step(p, order); if (s.status === status) return;
    s.status = status;
    audit(p, u, {active: 'step.activated', completed: 'step.completed', locked: 'step.locked'}[status], {step: s.name});
  }
  const visitsOf = p => db.visits.filter(v => v.project_id === p.id);
  const latest = p => { const vs = visitsOf(p); return vs[vs.length - 1] || null; };
  const engineerOf = p => p.members.map(user).find(u => u && u.role === 'civil_engineer') || null;

  /* ---------- progress (mirrors services/progress.py) ---------- */
  function deriveProgress(stageName, states){
    const idx = T.stages.findIndex(s => s.name === stageName);
    const stage = T.stages[idx];
    const done = stage.checklist.filter(i => states[i.id] === 'Done').length;
    const total = T.stages.slice(0, idx).reduce((a, s) => a + s.weight, 0) + stage.weight * done / stage.checklist.length;
    return Math.round((total + 1e-9) * 10) / 10;
  }

  /* ---------- validation (mirrors services/validation.py) ---------- */
  function validate(b){
    const miss = [], inv = [], blank = v => v == null || (typeof v === 'string' && !v.trim());
    ['visit_at', 'weather', 'attendees', 'current_stage', 'summary', 'recommended_action'].forEach(f => { if (blank(b[f])) miss.push(f); });
    const loc = b.location;
    if (!loc || (!loc.gps && blank(loc.manual))) miss.push('location');
    else if (loc.gps && !(Math.abs(loc.gps.lat) <= 90 && Math.abs(loc.gps.lng) <= 180)) inv.push('location.gps');
    const checklist = b.checklist || {}, problems = b.problems || [];
    if (!blank(b.current_stage)){
      const stage = T.stages.find(s => s.name === b.current_stage);
      if (!stage) inv.push('current_stage');
      else {
        const ids = stage.checklist.map(i => i.id);
        ids.forEach(i => { if (!(i in checklist)) miss.push('checklist.' + i); });
        Object.entries(checklist).forEach(([k, st]) => { if (!ids.includes(k) || !T.checklist_states.includes(st)) inv.push('checklist.' + k); });
      }
    }
    if (b.no_issues && problems.length) inv.push('no_issues');
    else if (!b.no_issues && !problems.length) miss.push('problems');
    problems.forEach((p, n) => {
      const at = `problems[${n}]`;
      if (blank(p.category)) miss.push(at + '.category');
      else if (!(p.category in T.problems)) inv.push(at + '.category');
      else if (p.category === 'Other'){ if (blank(p.other_text)) miss.push(at + '.other_text'); }
      else if (blank(p.problem)) miss.push(at + '.problem');
      else if (!T.problems[p.category].includes(p.problem)) inv.push(at + '.problem');
      if (blank(p.severity)) miss.push(at + '.severity');
      else if (!T.severities.includes(p.severity)) inv.push(at + '.severity');
      ['location', 'responsible_party', 'target_date'].forEach(f => { if (blank(p[f])) miss.push(`${at}.${f}`); });
    });
    return [miss, inv];
  }

  /* ---------- serializers (mirror schemas.py) ---------- */
  function visitBrief(v){
    if (!v) return null;
    const rw = db.reviews.filter(r => r.visit_id === v.id && r.decision === 'rework').pop();
    return {id: v.id, status: v.status, submission_count: v.submission_count, computed_progress: v.computed_progress,
      submitted_at: v.submitted_at, rework_comment: rw && v.status === 'rework' ? rw.comment : null};
  }
  function visitOut(v){
    const p = db.projects.find(x => x.id === v.project_id);
    return {...visitBrief(v), project: {id: p.id, name: p.name, location: p.location}, engineer: brief(user(v.engineer_id)),
      current_stage: v.current_stage, form: v.form, checklist: v.checklist, no_issues: v.no_issues, problems: v.problems,
      reviews: db.reviews.filter(r => r.visit_id === v.id).map(r => ({decision: r.decision, comment: r.comment, reviewer: brief(user(r.reviewer_id)), at: r.at}))};
  }
  function summary(p){
    const v = latest(p), active = p.steps.find(s => s.status === 'active');
    return {id: p.id, name: p.name, location: p.location, current_step: active ? active.name : null,
      official_progress: p.official_progress, latest_visit_status: v ? v.status : null, civil_engineer: brief(engineerOf(p))};
  }
  function detail(p){
    return {...summary(p), template: {id: T.id, version: T.version}, steps: p.steps.map(s => ({...s})), legal_approval: {...p.legal},
      latest_visit: visitBrief(latest(p)),
      audit: db.audit.filter(e => e.project_id === p.id).map(e => ({action: e.action, actor: (user(e.actor_id) || {}).name, at: e.at, detail: e.detail}))};
  }

  /* ---------- operations (mirror the routers) ---------- */
  function createProject(u, b){
    role(u, 'architect');
    const name = (b.name || '').trim(), location = (b.location || '').trim();
    if (!name || !location) fail(422, 'Project name and location are required');
    const eng = user(+b.civil_engineer_id);
    if (!eng || eng.role !== 'civil_engineer') fail(422, 'civil_engineer_id must be an active Civil Engineer');
    const admins = db.users.filter(x => x.role === 'admin').map(x => x.id);
    const p = {id: nextId('project'), name, location, official_progress: 0, members: [...new Set([u.id, eng.id, ...admins])],
      steps: T.steps.map((s, i) => ({order: i + 1, name: s, status: i === 0 ? 'active' : 'locked'})),
      legal: {status: 'Not started', authority_name: null, application_reference: null, application_date: null,
        approval_date: null, expected_date: b.legal_expected_date || null, document_reference: null}};
    db.projects.push(p);
    audit(p, u, 'project.created', {civil_engineer_id: eng.id});
    return p;
  }

  const LEGAL_NEXT = {'Not started': ['Applied'], 'Applied': ['Approved', 'Rejected']};
  const LEGAL_REQ = {Applied: ['authority_name', 'application_reference', 'application_date'],
    Approved: ['authority_name', 'application_reference', 'application_date', 'approval_date', 'document_reference']};
  function updateLegal(u, pid, b){
    role(u, 'admin');
    const p = project(u, pid), la = p.legal, cur = la.status, target = b.status || cur;
    if (!LEGAL_NEXT[cur]) fail(409, `Legal Approval is ${cur} and can no longer change`);
    if (target !== cur && !LEGAL_NEXT[cur].includes(target)) fail(409, `Cannot move Legal Approval from ${cur} to ${target}`);
    const changes = {};
    LEGAL_REQ.Approved.forEach(f => { if (f in b) changes[f] = typeof b[f] === 'string' ? (b[f].trim() || null) : b[f]; });
    const merged = {...la, ...changes};
    const missing = (LEGAL_REQ[target] || []).filter(f => !merged[f]);
    if (missing.length) fail(422, `${target} needs every required field`, {missing});
    if (merged.approval_date && merged.application_date && merged.approval_date < merged.application_date) fail(422, 'approval_date cannot be before application_date', {missing: []});
    Object.assign(la, changes, {status: target});
    audit(p, u, 'legal.updated', {from: cur, to: target, fields: Object.keys(changes).sort()});
    if (target === 'Approved'){ setStep(p, 1, 'completed', u); setStep(p, 2, 'active', u); }
    return p;
  }

  function submitVisit(u, pid, b){
    role(u, 'civil_engineer');
    const p = project(u, pid);
    if (step(p, 2).status !== 'active') fail(409, 'Site Visit step is not open for this project');
    const [missing, invalid] = validate(b);
    if (missing.length || invalid.length) fail(422, 'Site visit is incomplete', {missing, invalid});
    let v = visitsOf(p).find(x => x.status === 'rework');
    if (!v){ v = {id: nextId('visit'), project_id: p.id, submission_count: 0, created_at: now()}; db.visits.push(v); }
    Object.assign(v, {engineer_id: u.id, current_stage: b.current_stage,
      form: {visit_at: b.visit_at, location: b.location, weather: b.weather.trim(), attendees: b.attendees.trim(),
        summary: b.summary.trim(), recommended_action: b.recommended_action.trim()},
      checklist: {...b.checklist}, no_issues: !!b.no_issues, problems: (b.problems || []).map(x => ({...x})),
      computed_progress: deriveProgress(b.current_stage, b.checklist), status: 'submitted',
      submission_count: v.submission_count + 1, submitted_at: now()});
    audit(p, u, 'site_visit.submitted', {submission: v.submission_count, computed_progress: v.computed_progress});
    setStep(p, 2, 'completed', u); setStep(p, 3, 'active', u);
    return v;
  }

  function review(u, vid, b){
    role(u, 'team_lead');
    const v = db.visits.find(x => x.id === +vid); if (!v) fail(404, 'Site visit not found');
    if (v.status !== 'submitted') fail(409, `Site visit is ${v.status}, not waiting for review`);
    const comment = (b.comment || '').trim() || null;
    if (b.decision === 'rework' && !comment) fail(422, 'Rework needs a comment for the engineer', {missing: ['comment']});
    if (!['approve', 'rework'].includes(b.decision)) fail(422, 'Decision must be approve or rework');
    const p = db.projects.find(x => x.id === v.project_id);
    db.reviews.push({id: nextId('review'), visit_id: v.id, reviewer_id: u.id, decision: b.decision, comment, at: now()});
    const d = {submission: v.submission_count, comment};
    if (b.decision === 'approve'){
      v.status = 'approved'; p.official_progress = v.computed_progress;
      audit(p, u, 'site_visit.approved', {...d, official_progress: v.computed_progress});
      setStep(p, 3, 'completed', u);
    } else {
      v.status = 'rework';
      audit(p, u, 'site_visit.rework_requested', d);
      setStep(p, 3, 'locked', u); setStep(p, 2, 'active', u);
    }
    return v;
  }

  /* ---------- sample data ---------- */
  function seed(){
    db = {v: 1, seq: {}, users: [
      {id: 1, name: 'Meera Joshi', email: 'architect@siteflow.demo', role: 'architect'},
      {id: 2, name: 'Parvez', email: 'parvez@siteflow.demo', role: 'team_lead'},
      {id: 3, name: 'Farhan Shaikh', email: 'engineer@siteflow.demo', role: 'civil_engineer'},

const waitedText = m => m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h` : `${Math.floor(m / 1440)} d`;

function attentionRow(p){
  return `<div class="task attn-row" data-testid="attention-${p.id}">
    <span class="ti" style="background:var(--bad-soft);color:var(--bad)">${ico('flag')}</span>
    <span><b><button class="linkish" data-act="open-project" data-pid="${p.id}">${esc(p.name)}</button></b><span class="small muted">${esc(p.location)} · ${esc(p.current_step || 'Complete')}</span>
      <span class="flag-list">${p.flags.map(f => flagChip(f)).join('')}</span></span>
    <span class="meta mono small">${pct(p.official_progress)}</span></div>`;
}
function flagChip(f){
  const clearing = ui.p.clearing === f.id;
  return `<span class="flag-chip" data-testid="flag-${f.id}">${pill('rework', f.label)}<span class="small muted">since ${fmtStamp(f.raised_at)}</span>
    ${can.review() && !clearing ? `<button class="btn sm ghost" data-act="flag-clear" data-id="${f.id}" data-testid="flag-clear-${f.id}">Clear</button>` : ''}
    ${clearing ? `<span class="flag-clear-form"><input class="inp" id="fr-${f.id}" data-testid="flag-reason-${f.id}" placeholder="Reason for clearing" aria-label="Reason for clearing">
      <button class="btn sm primary" data-act="flag-confirm" data-id="${f.id}" data-testid="flag-confirm-${f.id}">Clear flag</button>
      <button class="btn sm ghost" data-act="flag-cancel">Cancel</button></span>` : ''}</span>`;
}
function majorRow(x){
  return `<button class="fi warn major-row" data-act="open-project" data-pid="${x.project.id}" data-testid="major-${x.id}">
    ${x.photo_id ? `<span class="major-thumb"><img data-mid="${x.photo_id}" alt="Photo of the problem"></span>` : `<span class="fic">${ico('alert')}</span>`}
    <div><div><b>${esc(x.problem)}</b> · ${esc(x.project.name)}</div>
      <div class="when">${pill(x.severity === 'Critical' ? 'rework' : 'active', x.severity)}<span>${esc(x.location)}</span><span>· ${esc(x.responsible_party)}</span>
      <span class="${x.target_date < new Date().toISOString().slice(0, 10) ? 'overdue-text' : ''}">· fix by ${fmtDate(x.target_date)}</span></div></div></button>`;
}
function filterBar(f){
  const T = TEMPLATE, sel = (id, label, options, val) => `<label class="flt"><span>${label}</span><select id="${id}" data-flt="${id.slice(3)}" data-testid="${id}"><option value="">Any</option>${options.map(([v, l]) => `<option value="${esc(v)}" ${String(val ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  const inp = (id, label, type, val, extra = '') => `<label class="flt"><span>${label}</span><input id="${id}" type="${type}" data-flt="${id.slice(3)}" data-testid="${id}" value="${esc(val ?? '')}" ${extra}></label>`;
  return `<details class="panel filters" data-testid="filters" ${Object.keys(f).length ? 'open' : ''}><summary class="panel-h"><h3>${ico('flow')}Filters</h3>${Object.keys(f).length ? `<button class="btn sm ghost" data-act="flt-reset" data-testid="flt-reset">Clear filters</button>` : ''}</summary>
    <div class="panel-b flt-grid">
      ${inp('fl-q', 'Project name', 'search', f.q)}${inp('fl-location', 'Location', 'search', f.location)}
      ${sel('fl-step', 'Current step', [['Legal Approval', 'Legal Approval'], ['Site Visit', 'Site Visit'], ['Team Lead Review', 'Team Lead Review']], f.step)}
      ${sel('fl-engineer_id', 'Civil Engineer', Object.entries(ui.data.engineers || {}), f.engineer_id)}
      ${sel('fl-red_flag', 'Red flag', [['true', 'Yes'], ['false', 'No']], f.red_flag)}
      ${sel('fl-severity', 'Problem severity', T.severities.map(s => [s, s]), f.severity)}
      ${sel('fl-category', 'Problem category', Object.keys(T.problems).map(c => [c, c]), f.category)}
      ${inp('fl-progress_min', 'Progress from %', 'number', f.progress_min, 'min="0" max="100" step="any"')}${inp('fl-progress_max', 'Progress to %', 'number', f.progress_max, 'min="0" max="100" step="any"')}
      ${inp('fl-visit_from', 'Last visit from', 'date', f.visit_from)}${inp('fl-visit_to', 'Last visit to', 'date', f.visit_to)}
    </div></details>`;
}
async function applyFilter(el){
  const f = {...ui.data.filters}, v = el.value.trim();
  if (v) f[el.dataset.flt] = v; else delete f[el.dataset.flt];
  saveFilters(f);
  const y = window.scrollY;
  try { await V.dashboard.load(); ui.error = null; } catch (err){ setError(err); ui.data.filters = f; }
  render(); window.scrollTo(0, y);
  const again = document.getElementById(el.id); if (again && el.type !== 'date' && el.tagName !== 'SELECT'){ again.focus(); try { again.setSelectionRange(v.length, v.length); } catch (_) {} }
}

function stepCard(p, order, kind, owner, body){
  const s = p.steps.find(x => x.order === order);
  return `<div class="scard ${s.status === 'active' ? 'cur' : ''}"><div><div class="eyebrow">Step ${order} · ${kind}</div><h3 style="margin:2px 0">${esc(s.name)}</h3><div class="who">${esc(owner)}</div></div>
    <div class="row">${pill(STEP_PILL[s.status], STEP_LABEL[s.status])}</div>
    ${body ? `<div style="grid-column:1/-1">${body}</div>` : ''}</div>`;
}

function legalCard(p){
  const la = p.legal_approval;
  const summary = `<dl class="kv" data-testid="legal-summary">
    <dt>Status</dt><dd>${esc(la.status)}</dd>
    <dt>Authority</dt><dd>${esc(la.authority_name || '—')}</dd>
    <dt>Reference</dt><dd>${esc(la.application_reference || '—')}</dd>
    <dt>Applied</dt><dd>${fmtDate(la.application_date)}</dd>
    <dt>Approved</dt><dd>${fmtDate(la.approval_date)}</dd>
    <dt>Expected by</dt><dd>${fmtDate(la.expected_date)}</dd>
    <dt>Document</dt><dd>${esc(la.document_reference || '—')}</dd></dl>`;
  const next = LEGAL_NEXT[la.status];
  const d = ui.data.legalDraft || {};

    <div class="fgrid">
      <div class="field"><label for="lg-status">Status</label><select id="lg-status" data-testid="legal-status">${[la.status, ...next].map(s => `<option ${s === chosen ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="field"><label for="lg-auth">Authority name</label><input id="lg-auth" data-testid="legal-authority" value="${esc(val('authority_name'))}"></div>
      <div class="field"><label for="lg-ref">Application reference</label><input id="lg-ref" data-testid="legal-reference" value="${esc(val('application_reference'))}"></div>
      <div class="field"><label for="lg-adate">Application date</label><input id="lg-adate" type="date" data-testid="legal-app-date" value="${esc(val('application_date'))}"></div>
      <div class="field"><label for="lg-pdate">Approval date</label><input id="lg-pdate" type="date" data-testid="legal-approval-date" value="${esc(val('approval_date'))}"></div>
      <div class="field"><label for="lg-doc">Approval document <span class="req">Required for Approved</span></label><input id="lg-doc" data-testid="legal-document" value="${esc(val('document_reference'))}" placeholder="Link or file reference"></div>
    </div>
    <div class="row"><button class="btn primary" type="submit" data-testid="legal-save">Save Legal Approval</button><span class="small muted" id="lg-hint"></span></div>
  </form>` : '';

function visitCard(p){
  const v = p.latest_visit;
  const open = p.steps.find(s => s.order === 2).status === 'active';
  const rework = v && v.status === 'rework' && v.rework_comment ? `<div class="banner rework" data-testid="rework-comment" style="margin-bottom:10px">${ico('alert')}<span><b>Rework requested:</b> ${esc(v.rework_comment)}</span></div>` : '';
  const action = can.visit() && open ? `<button class="btn primary sm" style="margin-top:10px" data-act="start-visit" data-pid="${p.id}" data-testid="visit-start">${ico('camera')}${v && v.status === 'rework' ? 'Resubmit site visit' : readDraft(p.id) ? 'Continue site visit' : 'Start site visit'}</button>` : '';
  const body = rework + (v ? `<dl class="kv"><dt>Latest visit</dt><dd>${pill(VISIT_PILL[v.status], VISIT_LABEL[v.status])}</dd>
    <dt>Submissions</dt><dd>${v.submission_count}</dd><dt>Derived progress</dt><dd data-testid="visit-progress">${pct(v.computed_progress)}${v.status === 'approved' ? '' : ' (pending approval)'}</dd></dl>` : '<span class="small muted">No site visit submitted yet.</span>') + action;
  return stepCard(p, 2, 'Site Visit', p.civil_engineer ? `${p.civil_engineer.name} · Civil Engineer` : 'Civil Engineer', body);
}

function reviewCard(p){
  const v = p.latest_visit;
  const waiting = p.steps.find(s => s.order === 3).status === 'active' && v && v.status === 'submitted';
  const body = can.review() && waiting ? `<button class="btn primary sm" data-act="open-review" data-vid="${v.id}" data-testid="review-open">${ico('eye')}Review submission</button>` : '';
  return stepCard(p, 3, 'Team Lead Review', 'Parvez · Team Lead', body);
}

/* ---------- site visit (Civil Engineer) ---------- */
let TEMPLATE = null;
const MEDIA = typeof API.uploadMedia === 'function';
const visitMedia = () => (ui.data.server && ui.data.server.media) || [];
const photosOf = ref => visitMedia().filter(m => m.kind === 'photo' && m.problem_ref === ref);
const needsPhoto = p => p.severity === 'High' || p.severity === 'Critical';
async function template(){ if (!TEMPLATE) TEMPLATE = await API.template(); return TEMPLATE; }
const draftKey = pid => `siteflow.draft.${ui.me.id}.${pid}`;
function readDraft(pid){ try { return JSON.parse(localStorage.getItem(draftKey(pid)) || 'null'); } catch (_) { return null; } }
function saveDraft(){ try { localStorage.setItem(draftKey(ui.p.pid), JSON.stringify(ui.data.draft)); ui.data.savedAt = Date.now(); } catch (_) {} const l = $('#savedlbl'); if (l) l.textContent = 'Draft saved on this device'; }
function dropDraft(pid){ try { localStorage.removeItem(draftKey(pid)); } catch (_) {} }
const localNow = () => { const d = new Date(); d.setSeconds(0, 0); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
const toLocalInput = iso => { const d = new Date(iso); return isNaN(d) ? localNow() : new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
const blankProblem = () => ({category: '', problem: '', other_text: '', severity: '', location: '', responsible_party: '', target_date: ''});

function draftFromVisit(v){
  const f = v.form || {}, loc = f.location || {};
  return {visit_at: localNow(), gps: loc.gps || null, manual: loc.manual || '', weather: f.weather || '', attendees: f.attendees || '',
    current_stage: v.current_stage || '', checklist: {...(v.checklist || {})}, no_issues: !!v.no_issues,
    problems: (v.problems || []).map(p => ({...blankProblem(), ...Object.fromEntries(Object.entries(p).map(([k, x]) => [k, x ?? '']))})),
    summary: f.summary || '', recommended_action: f.recommended_action || ''};

const emptyDraft = () => ({visit_at: localNow(), gps: null, manual: '', weather: '', attendees: '', current_stage: '', checklist: {},
  no_issues: false, problems: [], summary: '', recommended_action: ''});

const PROBLEM_LABELS = {category: 'category', problem: 'problem', other_text: 'description', severity: 'severity',
  location: 'location on site', responsible_party: 'responsible party', target_date: 'target fix date',
  photo: 'photo of the problem (High and Critical)'};
function visitLabel(path){
  const fixed = {visit_at: 'Visit date and time', location: 'Location (GPS or manual entry)', 'location.gps': 'GPS coordinates',
    weather: 'Weather', attendees: 'Attendees', current_stage: 'Construction stage', problems: 'Problems, or tick “No issues found”',
    no_issues: '“No issues found” cannot be ticked while problems are listed', summary: 'Summary', recommended_action: 'Recommended action'};
  if (fixed[path]) return fixed[path];
  if (path === 'photos'){
    const n = visitMedia().filter(x => x.kind === 'photo').length;
    return `Photos: at least ${TEMPLATE ? TEMPLATE.min_photos : ''} (${n} added)`;
  }
  let m = path.match(/^checklist\.(.+)$/);
  if (m){ const it = (TEMPLATE ? TEMPLATE.stages.flatMap(s => s.checklist) : []).find(i => i.id === m[1]); return `Checklist: ${it ? it.label : m[1]}`; }
  m = path.match(/^problems\[(\d+)\]\.(.+)$/);
  if (m) return `Problem ${+m[1] + 1}: ${PROBLEM_LABELS[m[2]] || m[2]}`;
  return path;
}

/* Mirrors the server's validation so the engineer sees what is missing before submitting. */
function visitMissing(d){
  const miss = [];
  const blank = v => !String(v ?? '').trim();
  if (blank(d.visit_at)) miss.push('visit_at');
  if (!d.gps && blank(d.manual)) miss.push('location');
  ['weather', 'attendees', 'current_stage'].forEach(k => { if (blank(d[k])) miss.push(k); });
  const stage = TEMPLATE.stages.find(s => s.name === d.current_stage);
  if (stage) stage.checklist.forEach(i => { if (!d.checklist[i.id]) miss.push('checklist.' + i.id); });
  if (!d.no_issues && !d.problems.length) miss.push('problems');
  if (d.no_issues && d.problems.length) miss.push('no_issues');
  d.problems.forEach((p, n) => {
    const at = `problems[${n}]`;
    if (blank(p.category)) miss.push(at + '.category');
    else if (p.category === 'Other'){ if (blank(p.other_text)) miss.push(at + '.other_text'); }
    else if (blank(p.problem)) miss.push(at + '.problem');
    ['severity', 'location', 'responsible_party', 'target_date'].forEach(k => { if (blank(p[k])) miss.push(`${at}.${k}`); });
  });
  if (MEDIA){
    if (visitMedia().filter(m => m.kind === 'photo').length < TEMPLATE.min_photos) miss.push('photos');
    d.problems.forEach((p, n) => { if (needsPhoto(p) && !photosOf(n).length) miss.push(`problems[${n}].photo`); });
  }
  ['summary', 'recommended_action'].forEach(k => { if (blank(d[k])) miss.push(k); });
  return miss;
}

function visitPayload(d){
  const s = v => (String(v ?? '').trim() || null);
  const stage = TEMPLATE.stages.find(x => x.name === d.current_stage);
  const ids = stage ? stage.checklist.map(i => i.id) : [];
  return {
    visit_at: d.visit_at ? new Date(d.visit_at).toISOString() : null,
    location: {gps: d.gps, manual: s(d.manual)},
    weather: s(d.weather), attendees: s(d.attendees), current_stage: s(d.current_stage),
    checklist: Object.fromEntries(Object.entries(d.checklist).filter(([k]) => ids.includes(k))),
    no_issues: d.no_issues,
    problems: d.problems.map(p => ({category: s(p.category), problem: p.category === 'Other' ? null : s(p.problem),
      other_text: p.category === 'Other' ? s(p.other_text) : null, severity: s(p.severity), location: s(p.location),
      responsible_party: s(p.responsible_party), target_date: s(p.target_date)})),
    summary: s(d.summary), recommended_action: s(d.recommended_action)
  };
}

/* A file input per pick, so the camera opens straight away where the device supports capture. */
function pickFiles(kind, capture, ref){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.hidden = true;
  inp.accept = (kind === 'photo' ? TEMPLATE.photo_types : TEMPLATE.video_types).join(',');
  if (capture) inp.setAttribute('capture', 'environment');
  inp.multiple = kind === 'photo' && ref === null && !capture;
  inp.addEventListener('change', () => { const files = [...inp.files]; inp.remove(); uploadFiles(files, kind, ref); });
  document.body.appendChild(inp);
  inp.click();
}

async function uploadFiles(files, kind, ref){
  const T = TEMPLATE, types = kind === 'photo' ? T.photo_types : T.video_types;
  const limit = (kind === 'photo' ? T.max_photo_mb : T.max_video_mb) * 1048576;
  for (const f of files){
    if (!types.includes(f.type)){ toast(`${f.name || 'That file'} is not a supported ${kind}. Use ${types.map(t => t.split('/')[1].toUpperCase()).join(', ')}.`); continue; }
    if (f.size > limit){ toast(`${f.name || 'That file'} is over the ${limit / 1048576} MB limit for a ${kind}.`); continue; }
    const up = {id: Math.random().toString(36).slice(2), ref, pct: 0};
    ui.data.uploads.push(up); rerenderKeepScroll();
    // A camera file's lastModified is when it was taken; files older than a day use the upload time.
    const taken = f.lastModified && Date.now() - f.lastModified < 864e5 ? new Date(f.lastModified) : new Date();
    const gps = ui.data.draft.gps;
    try {
      const m = await API.uploadMedia(ui.data.server.id, f, {kind, problem_ref: ref, captured_at: taken.toISOString(),
        lat: gps ? gps.lat : null, lng: gps ? gps.lng : null}, pct => { up.pct = pct; const bar = $('#up-' + up.id); if (bar) bar.style.width = Math.round(pct * 100) + '%'; });
      ui.data.server.media.push(m);
    } catch (err){
      toast(err.status === 413 || err.status === 415 ? err.message : `Upload failed: ${err.message}`);
    } finally {
      ui.data.uploads = ui.data.uploads.filter(u => u !== up);
      if (ui.route === 'visit') rerenderKeepScroll();
    }
  }
}

      <section class="sec"><div class="sec-h"><h3>${ico('doc')}Summary</h3></div><div class="sec-b"><dl class="kv"><dt>Summary</dt><dd>${esc(f.summary)}</dd><dt>Recommended action</dt><dd>${esc(f.recommended_action)}</dd></dl></div></section>
    </div>
    <div class="panel reqpanel"><div class="panel-h"><h3>Decision</h3></div><div class="panel-b form">
      ${canAct ? `<div class="field"><label for="rv-c">Comment</label><textarea id="rv-c" rows="4" data-testid="review-comment" placeholder="Required when requesting rework">${esc(ui.p.comment)}</textarea></div>
        <button class="btn primary" data-act="review-approve" data-testid="review-approve">${ico('check')}Approve</button>
        <button class="btn danger" data-act="review-rework" data-testid="review-rework">Request rework</button>` : `<p class="muted">This visit is ${esc(VISIT_LABEL[v.status].toLowerCase())}; no decision is pending.</p>`}
      ${v.reviews.length ? `<div class="subh" style="margin-top:6px">History</div>${v.reviews.slice().reverse().map(r => `<div class="small"><b>${esc(r.reviewer ? r.reviewer.name : '')}</b> <span class="muted">${fmtStamp(r.at)} · ${r.decision === 'rework' ? 'Rework' : 'Approved'}</span>${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div>`).join('')}` : ''}
    </div></div></div>`;
  }
};

/* Read-only media grid; a tap opens the larger view with capture time and GPS. */
function reviewMedia(list, where){
  if (!list.length) return where === 'site' ? '<span class="small muted">No other photos.</span>' : '';
  return `<div class="photos" data-testid="review-media-${where}">${list.map(m => `<button class="ph" data-act="open-media" data-id="${m.id}" data-testid="review-tile-${m.id}" aria-label="Open ${m.kind}">
    ${m.kind === 'photo' ? `<img data-mid="${m.id}" alt="Site photo">` : `<div class="ph-video">${ico('video')}<span>Video</span></div>`}
    <span class="ph-tag">${esc(fmtShortTime(m.captured_at))}</span></button>`).join('')}</div>`;
}
const fmtShortTime = iso => new Date(iso).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit'});

function lightbox(){
  const all = [...(ui.data.visit ? ui.data.visit.media || [] : []), ...((ui.data.server && ui.data.server.media) || [])];
  const m = all.find(x => x.id === ui.lightbox);
  if (!m) return '';
  return `<div class="lightbox" data-testid="lightbox" role="dialog" aria-label="Photo"><div class="lb-body">
    ${m.kind === 'photo' ? `<img data-mid="${m.id}" alt="Site photo">` : `<video data-mid="${m.id}" controls playsinline></video>`}
    <div class="lb-meta"><span>${fmtStamp(m.captured_at)}${m.lat != null ? ` · <span class="mono">${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</span>` : ' · no GPS'}</span>
      <span>${m.problem_ref != null ? `Problem ${m.problem_ref + 1} · ` : ''}${esc(m.uploader ? m.uploader.name : '')}</span>
      <button class="btn sm" data-act="close-media" data-testid="lightbox-close">Close</button></div></div></div>`;
}

async function decide(decision){
  const v = ui.data.visit, comment = ($('#rv-c') ? $('#rv-c').value : '').trim();
  ui.p.comment = comment;
  if (decision === 'rework' && !comment){ ui.error = {message: 'Add a comment so the engineer knows what to fix.', items: []}; render(); return; }
  try {
    await API.review(v.id, {decision, comment: comment || null});
    toast(decision === 'approve' ? 'Approved. Progress is now official.' : 'Sent back for rework.');
    await go('project', {pid: v.project.id});
  } catch (err){ setError(err, {comment: 'Comment'}); render(); }
}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle('anon', !ui.me);
  if (!ui.me){ $('#side').innerHTML = ''; $('#tabs').innerHTML = ''; $('#main').innerHTML = V.login.html(); return; }
  const v = V[ui.route] || V.projects;
  $('#main').innerHTML = shell() + (ui.loadError ? `<div class="errbox" data-testid="load-error">${esc(ui.loadError)}</div>` : v.html()) + lightbox();
  document.body.classList.toggle('focus', ui.route === 'visit');
  if (ui.route === 'project') syncLegalSave();
  hydrateMedia();
}

/* Thumbnails are fetched with the sign-in token after each render. */
function hydrateMedia(){
  if (!MEDIA) return;
  document.querySelectorAll('img[data-mid]:not([src])').forEach(async img => {
    try { img.src = await API.mediaUrl(+img.dataset.mid); } catch (_) { img.alt = 'Photo could not be loaded'; }
  });
  document.querySelectorAll('video[data-mid]:not([src])').forEach(async v => {
    try { v.src = await API.mediaUrl(+v.dataset.mid); } catch (_) {}
  });
}

/* Save stays disabled for Approved until a document reference is entered. */
function syncLegalSave(){
  const st = $('#lg-status'), doc = $('#lg-doc'), btn = $('[data-testid="legal-save"]');
  if (!st || !btn) return;
  const blocked = st.value === 'Approved' && !doc.value.trim();
  btn.disabled = blocked;
  $('#lg-hint').textContent = blocked ? 'Attach the approval document to save as Approved.' : '';
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act){
    case 'open-project': go('project', {pid: +a.dataset.pid}); break;
    case 'sign-out': API.logout(); showLogin(); break;
    case 'set-server': API.setBase($('#li-api').value.trim()); toast(`Server set to ${API.base()}`); break;
    case 'start-visit': go('visit', {pid: +a.dataset.pid}); break;
    case 'demo-login':
      try { ui.me = await API.login(a.dataset.email, API.demoPassword); ui.error = null; await go(home()); }
      catch (err){ ui.error = err.message; render(); }
      break;
    case 'reset-demo':
      // The viewer blocks confirm(), so a second tap confirms.
      if (!a.dataset.confirm){ a.dataset.confirm = '1'; a.textContent = 'Tap again to reset'; setTimeout(() => { if (a.isConnected){ delete a.dataset.confirm; a.textContent = 'Reset demo data'; } }, 3000); break; }
      API.resetDemo(); try { Object.keys(localStorage).filter(k => k.startsWith('siteflow.draft.')).forEach(k => localStorage.removeItem(k)); } catch (_) {}
      toast('Demo data reset.'); await go(home()); break;
    case 'open-review': go('review', {vid: +a.dataset.vid}); break;
    case 'add-problem': ui.data.draft.problems.push(blankProblem()); ui.data.draft.no_issues = false; saveDraft(); rerenderKeepScroll(); break;
    case 'del-problem': {
      const n = +a.dataset.n;
      // Photos are tagged by problem position: untag this problem's photos, shift those below it up.
      if (MEDIA) try {
        for (const m of visitMedia().filter(x => x.problem_ref != null && x.problem_ref >= n)){
          const ref = m.problem_ref === n ? null : m.problem_ref - 1;
          Object.assign(m, await API.retagMedia(m.id, ref));
        }
      } catch (err){ toast(err.message); break; }
      ui.data.draft.problems.splice(n, 1); saveDraft(); rerenderKeepScroll(); break; }
    case 'open-media': ui.lightbox = +a.dataset.id; rerenderKeepScroll(); break;
    case 'open-note':
      try { await API.readNotification(+a.dataset.id); } catch (_) {}
      if (a.dataset.pid) await go('project', {pid: +a.dataset.pid}); else await go('alerts');
      break;
    case 'read-all':
      try { await API.readAllNotifications(); ui.unread = 0; toast('All notifications marked read.'); } catch (err){ toast(err.message); }
      await go('alerts'); break;
    case 'flag-clear': ui.p.clearing = +a.dataset.id; rerenderKeepScroll(); { const i = $('#fr-' + a.dataset.id); if (i) i.focus(); } break;
    case 'flag-cancel': ui.p.clearing = null; rerenderKeepScroll(); break;
    case 'flag-confirm': {
      const reason = ($('#fr-' + a.dataset.id) || {}).value || '';
      if (!reason.trim()){ toast('Give a reason for clearing this red flag.'); break; }
      try { await API.clearFlag(+a.dataset.id, reason.trim()); ui.p.clearing = null; toast('Red flag cleared. The reason is in the audit trail.'); await V.dashboard.load(); ui.error = null; }
      catch (err){ setError(err); }
      rerenderKeepScroll(); break; }
    case 'flt-reset': e.preventDefault(); saveFilters({}); await go('dashboard'); break;
    case 'close-media': ui.lightbox = null; rerenderKeepScroll(); break;
    case 'pick-media': pickFiles(a.dataset.kind, !!a.dataset.capture, a.dataset.ref === undefined ? null : +a.dataset.ref); break;
    case 'del-media':
      try { await API.deleteMedia(+a.dataset.id); ui.data.server.media = visitMedia().filter(m => m.id !== +a.dataset.id); rerenderKeepScroll(); }
      catch (err){ toast(err.message); }
      break;
    case 'clear-gps': ui.data.draft.gps = null; saveDraft(); rerenderKeepScroll(); break;
    case 'gps':
      if (!navigator.geolocation){ toast('GPS is not available here. Describe the location instead.'); break; }
      a.disabled = true; a.textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(pos => {
        ui.data.draft.gps = {lat: pos.coords.latitude, lng: pos.coords.longitude}; saveDraft(); rerenderKeepScroll(); toast('Location captured.');
      }, () => { rerenderKeepScroll(); toast('Could not get a GPS fix. Describe the location instead.'); }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
      break;
    case 'submit-visit': {
      const d = ui.data.draft;
      if (visitMissing(d).length){ refreshVisit(); toast('Some required items are missing.'); break; }
      a.disabled = true;
      try {
        const v = await API.submitVisit(ui.p.pid, visitPayload(d));
        dropDraft(ui.p.pid);
        toast(`Submitted for review. Derived progress ${pct(v.computed_progress)}.`);
        await go('project', {pid: ui.p.pid});
      } catch (err){ setError(err, visitLabel); rerenderKeepScroll(); window.scrollTo(0, 0); }
      break; }
    case 'review-approve': decide('approve'); break;
    case 'review-rework': decide('rework'); break;
  }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    switch (form.dataset.form){
      case 'login': {
        ui.loginEmail = $('#li-email').value.trim();
        try { ui.me = await API.login(ui.loginEmail, $('#li-pass').value); }
        catch (err){ ui.error = err.message; render(); const pw = $('#li-pass'); if (pw) pw.focus(); return; }
        ui.error = null; await go(home()); break;
      }
      case 'new-project': {
        const body = {name: $('#np-name').value.trim(), location: $('#np-loc').value.trim(),
          civil_engineer_id: +$('#np-eng').value || null, legal_expected_date: $('#np-date').value || null};
        const miss = [!body.name && 'Project name', !body.location && 'Location', !body.civil_engineer_id && 'Civil Engineer'].filter(Boolean);
        ui.p.form = body;
        if (miss.length){ ui.error = {message: `${miss.join(', ')} ${miss.length === 1 ? 'is' : 'are'} required.`, items: []}; render(); return; }
        try { const p = await API.createProject(body); toast(`${p.name} created. Legal Approval is open.`); await go('project', {pid: p.id}); }
        catch (err){ setError(err); render(); }
        break;
      }
      case 'legal': {
        const p = ui.data.project, la = p.legal_approval;
        const body = {};
        const status = $('#lg-status').value; if (status !== la.status) body.status = status;
        const vals = {authority_name: '#lg-auth', application_reference: '#lg-ref', application_date: '#lg-adate', approval_date: '#lg-pdate', document_reference: '#lg-doc'};
        const draft = {status};
        Object.entries(vals).forEach(([k, sel]) => { const v = $(sel).value.trim(); draft[k] = v; if (v && v !== (la[k] || '')) body[k] = v; });
        try { ui.data.project = await API.updateLegal(p.id, body); ui.error = null; ui.data.legalDraft = null; toast(status === 'Approved' ? 'Legal Approval approved. Site Visit is open.' : 'Legal Approval saved.'); }
        catch (err){ setError(err, LEGAL_FIELDS); ui.data.legalDraft = draft; }
        render(); break;
      }
    }
  } finally { if (btn && btn.isConnected) btn.disabled = false; if (ui.route === 'project') syncLegalSave(); }
});

function setProblem(el){ const [n, k] = el.dataset.p.split('.'); const pr = ui.data.draft.problems[+n]; pr[k] = el.value; if (k === 'category'){ pr.problem = ''; pr.other_text = ''; } }
document.addEventListener('input', e => {
  const el = e.target;
  if (ui.route === 'visit' && ui.data.draft && el.tagName !== 'SELECT' && el.type !== 'checkbox'){
    if (el.dataset.v){ ui.data.draft[el.dataset.v] = el.value; saveDraft(); refreshVisit(); return; }
    if (el.dataset.p){ setProblem(el); saveDraft(); refreshVisit(); return; }
  }
  if (el.id === 'lg-doc') syncLegalSave();
});
let fltTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.flt || el.tagName === 'SELECT' || el.type === 'date') return;
  clearTimeout(fltTimer); fltTimer = setTimeout(() => applyFilter(el), 350);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.flt && (el.tagName === 'SELECT' || el.type === 'date')){ applyFilter(el); return; }
  if (ui.route === 'visit' && ui.data.draft){
    const d = ui.data.draft;
    if (el.dataset.v) d[el.dataset.v] = el.type === 'checkbox' ? el.checked : el.value;
    else if (el.dataset.chk) d.checklist[el.dataset.chk] = el.value;
    else if (el.dataset.p) setProblem(el);
    else return;
    saveDraft();
    if (el.dataset.rerender) rerenderKeepScroll(); else refreshVisit();
    return;
  }
  if (el.id === 'lg-status') syncLegalSave();
});
window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());
if (isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
  window.Capacitor.Plugins.App.addListener('backButton', () => { if (ui.route !== home() && ui.me) go(home()); else window.Capacitor.Plugins.App.exitApp(); });
}

/* ---------- boot ---------- */
(async () => {
  if (!API.signedIn()) return showLogin();
  try { ui.me = await API.me(); await go(home()); }
  catch (e) { showLogin(API.signedIn() ? e.message : null); }
})();
})();

</script>
