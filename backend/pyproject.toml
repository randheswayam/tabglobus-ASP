[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042 (StrEnum): the str/Enum models are stored and compared by value; switching changes str() and format output.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies in argument defaults are the framework's documented pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "app.deps.require_role"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files; the autogenerated imports and layout are kept as generated.
"migrations/versions/*" = ["E501", "I001", "UP035", "UP007", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
