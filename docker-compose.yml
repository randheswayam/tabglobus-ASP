# The whole SiteFlow stack: `docker compose up --build`, then open http://localhost:8080.
# Secrets come from .env (copy .env.example to .env and fill it in).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: siteflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: siteflow
    ports:
      - "5432:5432"
    volumes:
      - siteflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteflow -d siteflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://siteflow:${POSTGRES_PASSWORD}@db:5432/siteflow
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - siteflow-media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro

volumes:
  # Same volume as the earlier backend/docker-compose.yml, so existing local data is kept.
  siteflow-db:
    name: backend_siteflow-db
  siteflow-media:
