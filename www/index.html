<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B6F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SiteFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#ECEEEA; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#1B2428; --ink-2:#56625F; --ink-3:#7F8A87;
  --line:#D5DAD4; --line-2:#E4E7E2;
  --accent:#0E6B6F; --accent-2:#0A5558; --accent-ink:#FFFFFF; --accent-soft:#DCECEA;
  --hivis:#D99613; --hivis-soft:#FBF0D6;
  --ok:#2E7A4D; --ok-soft:#DDEFE3; --warn:#A8660F; --warn-soft:#F8E9D0; --bad:#B42318; --bad-soft:#F9E0DC;
  --shadow:0 1px 2px rgba(20,35,38,.06),0 4px 14px rgba(20,35,38,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111719; --surface:#192124; --surface-2:#1F292C; --ink:#E5EBE8; --ink-2:#9DAAA6; --ink-3:#72807C;
    --line:#2D393C; --line-2:#253033;
    --accent:#4CB2AE; --accent-2:#6CC7C3; --accent-ink:#08191A; --accent-soft:#1B3637;
    --hivis:#EDB23D; --hivis-soft:#3A2F17;
    --ok:#5DBB82; --ok-soft:#18342A; --warn:#E3A948; --warn-soft:#3A2D16; --bad:#F2786D; --bad-soft:#3D1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111719; --surface:#192124; --surface-2:#1F292C; --ink:#E5EBE8; --ink-2:#9DAAA6; --ink-3:#72807C;
  --line:#2D393C; --line-2:#253033;
  --accent:#4CB2AE; --accent-2:#6CC7C3; --accent-ink:#08191A; --accent-soft:#1B3637;
  --hivis:#EDB23D; --hivis-soft:#3A2F17;
  --ok:#5DBB82; --ok-soft:#18342A; --warn:#E3A948; --warn-soft:#3A2D16; --bad:#F2786D; --bad-soft:#3D1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-2)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.whois{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.whois select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:13px}
.credit{font-size:10.5px;color:var(--ink-3);padding:0 6px;letter-spacing:.04em}

main{min-width:0;padding-inline:32px;padding-block:24px 48px}
.mtop,.tabs{display:none}
.offline{display:flex;gap:8px;align-items:center;background:var(--hivis-soft);color:var(--warn);border:1px solid var(--hivis);padding:8px 12px;border-radius:8px;margin-bottom:16px;font-weight:500}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{color:var(--ink-2);margin-top:4px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.5px;margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--ink-2);font-size:12.5px}
.kpi.alert b{color:var(--bad)}
.kpi.attn b{color:var(--hivis)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.pill.active{background:var(--hivis-soft);color:var(--warn);border-color:transparent}
.pill.submitted,.pill.review{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.rework,.pill.overdue{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* task list */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task .ti{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.task-capture .ti{background:var(--hivis-soft);color:var(--warn)}
.task-review .ti{background:var(--accent-soft);color:var(--accent-2)}
.task b{font-weight:600;display:block}
.task .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:22px 16px;color:var(--ink-2);text-align:center}

/* project cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.pcard:hover{border-color:var(--accent)}
.pcard h3{font-size:16px}
.pcard .loc{font-size:12.5px;color:var(--ink-2)}
.ministep{display:flex;gap:4px}
.ministep i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ministep i.done{background:var(--ok)}
.ministep i.active,.ministep i.rework{background:var(--hivis)}
.ministep i.submitted{background:var(--accent)}
.pcard .now{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}

/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.fi:last-child{border-bottom:0}
.fi .fic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.fi .fic svg{width:15px;height:15px}
.fi.ok .fic{background:var(--ok-soft);color:var(--ok)}
.fi.warn .fic{background:var(--bad-soft);color:var(--bad)}
.fi.ms .fic{background:var(--hivis-soft);color:var(--warn)}
.fi.unread{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.fi .when{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ch{font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink-3)}

/* stepper */
.stepper-wrap{overflow-x:auto;margin-bottom:20px}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:0;min-width:min-content}
.st{flex:1;min-width:150px;position:relative}
.st button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px 12px 0;border:0;background:none;text-align:left}
.st::before{content:"";position:absolute;top:26px;left:30px;right:0;height:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.st-done::before{background:var(--ok)}
.st-n{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--ink-3)}
.st-done .st-n{background:var(--ok);border-color:var(--ok);color:#fff}
.st-active .st-n,.st-rework .st-n{border-color:var(--hivis);color:var(--warn);background:var(--hivis-soft)}
.st-submitted .st-n{border-color:var(--accent);color:var(--accent)}
.st-n svg{width:15px;height:15px;stroke-width:2.6}
.st-l{font-weight:600;font-size:13.5px;padding-right:10px}
.st-s{font-size:12px;color:var(--ink-2)}

.steps{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.scard.cur{border-color:var(--hivis);box-shadow:inset 3px 0 0 var(--hivis)}
.scard .who{font-size:12.5px;color:var(--ink-2)}
.branches{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.branch{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.thumbs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.team{display:flex;flex-direction:column;gap:8px}
.person{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.audit{display:flex;flex-direction:column;gap:10px;font-size:12.5px;max-height:320px;overflow:auto}
.audit div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req{font-size:10.5px;font-weight:600;color:var(--warn);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:14px}
.field textarea{resize:vertical;min-height:76px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.miss input,.field.miss textarea,.field.miss select{border-color:var(--bad)}
.ro{padding:8px 0;white-space:pre-wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.sec-h h3{display:flex;gap:8px;align-items:center}
.sec-b{padding:16px}

.act{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.reqpanel{position:sticky;top:20px}
.reqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.reqlist li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.reqlist .ck{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);margin-top:1px}
.reqlist li.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.reqlist li.ok .ck svg{width:11px;height:11px;stroke-width:3}
.reqlist li.no{color:var(--ink-2)}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .25s}
.errbox{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner.rework{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--accent-2)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.saved{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.ph button svg{width:13px;height:13px}
.addph{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);background:none;font-size:12.5px;font-weight:600;max-width:100%}
.addph:hover{border-color:var(--accent);color:var(--accent)}
.addph svg{width:22px;height:22px}
.pcount{font-family:var(--f-mono);font-size:12.5px}
.ph-tag{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 5px}
.ph-video{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:11.5px;font-weight:600}
.ph-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .2s}
.ph-up{border-style:dashed}
button.ph{padding:0;cursor:zoom-in}
/* dashboard */
.filters{margin-bottom:16px}
.filters summary{cursor:pointer;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.flt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.flt{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.flt input,.flt select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13px;color:var(--ink);width:100%}
.dash-table tr.clickable{cursor:pointer}
.dash-table tr.clickable:hover td{background:var(--surface-2)}
.dash-table td{vertical-align:top;padding:9px 8px}
.attn-row{cursor:default}
.linkish{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);text-align:left}
.linkish:hover{color:var(--accent)}
.flag-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.flag-chip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flag-clear-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.flag-clear-form .inp{flex:1;min-width:160px;padding:6px 9px;font-size:13px}
.major-row{width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left}
.major-row:hover{background:var(--surface-2)}
.major-thumb{width:44px;height:34px;border-radius:5px;overflow:hidden;background:var(--surface-2);display:block}
.major-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.major-row.fi{grid-template-columns:44px minmax(0,1fr)}
.overdue-text{color:var(--bad);font-weight:600}
/* stage tracker */
.section-h{font-size:15px;margin:18px 0 10px}
.so-summary{white-space:pre-wrap}
.onboard{border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.onboard summary{cursor:pointer}
.share-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.share-ph{position:relative;display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.share-ph img{width:100%;height:100%;object-fit:cover;display:block}
.share-ph input{position:absolute;top:5px;left:5px;width:18px;height:18px;accent-color:var(--accent)}
.cupdate{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.doc-row .pill{margin-left:auto}
.doc-viewer{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.doc-viewer iframe{width:100%;height:min(70vh,640px);border:1px solid var(--line);border-radius:8px;background:#fff}
.doc-viewer img{max-width:100%;border:1px solid var(--line);border-radius:8px}
.so-confirm{align-items:flex-start}
.so-confirm span{font-size:13px}

<body>


<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- SiteFlow API client ---------- */
/* exported SiteFlowAPI */
const SiteFlowAPI = (() => {
  'use strict';
  const K_BASE = 'siteflow.api', K_TOKEN = 'siteflow.token', K_REFRESH = 'siteflow.refresh';
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) {} }
  };
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

  // ?api=http://host:port overrides the server (kept for next launches), e.g. a phone on the office Wi-Fi.
  const qp = new URLSearchParams(location.search).get('api');
  if (qp && /^https?:\/\//i.test(qp)) store.set(K_BASE, qp.replace(/\/+$/, ''));

  function defaultBase(){
    if (native) return 'http://10.0.2.2:8000';  // Android emulator's route to the host machine
    if (/^https?:$/.test(location.protocol)) return `${location.protocol}//${location.hostname}:8000`;
    return 'http://localhost:8000';
  }
  const base = () => store.get(K_BASE) || defaultBase();
  const token = () => store.get(K_TOKEN);
  let onSignedOut = null;
  const mediaUrls = {};

  class ApiError extends Error {
    constructor(status, message, detail){ super(message); this.status = status; this.detail = detail; }
    get missing(){ return (this.detail && this.detail.missing) || []; }
    get invalid(){ return (this.detail && this.detail.invalid) || []; }
  }

  function messageOf(data, status){
    const d = data && data.detail;
    if (typeof d === 'string') return d;
    if (d && d.message) return d.message;
    if (Array.isArray(d) && d.length) return 'Check these fields: ' + d.map(e => (e.loc || []).slice(1).join('.')).join(', ');
    return status ? `Request failed (${status})` : 'Request failed';
  }

  function saveTokens(r){ store.set(K_TOKEN, r.access_token); store.set(K_REFRESH, r.refresh_token); }
  function signedOut(){ store.set(K_TOKEN, null); store.set(K_REFRESH, null); if (onSignedOut) onSignedOut(); }

  // One refresh at a time: requests that fail together wait for the same new token.
  let refreshing = null;
  function renew(){
    const rt = store.get(K_REFRESH);
    if (!rt) return Promise.resolve(false);
    if (!refreshing){
      refreshing = fetch(base() + '/auth/refresh', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({refresh_token: rt})})
        .then(async r => { if (!r.ok) return false; saveTokens(await r.json()); return true; })
        .catch(() => false)
        .finally(() => { refreshing = null; });
    }
    return refreshing;
  }

  // fetch with the access token; on 401, renew the session once and retry, else sign out.
  async function authFetch(url, opts = {}){
    const go = () => {
      const headers = {...(opts.headers || {})}, t = token();
      if (t) headers.Authorization = 'Bearer ' + t;
      return fetch(url, {...opts, headers});
    };
    let r = await go();
    if (r.status === 401 && token()){
      if (await renew()) r = await go();
      if (r.status === 401) signedOut();
    }
    return r;
  }

  async function request(method, path, body){
    const headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    let r;
    try { r = await authFetch(base() + path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)}); }
    catch (_) { throw new ApiError(0, `Cannot reach the SiteFlow server at ${base()}. Check your connection.`); }
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new ApiError(r.status, messageOf(data, r.status), data && data.detail);
    return data;
  }

  async function requestForm(path, form){
    let r;
    try { r = await authFetch(base() + path, {method: 'POST', body: form}); }
    catch (_) { throw new ApiError(0, `Cannot reach the SiteFlow server at ${base()}. Check your connection.`); }
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new ApiError(r.status, messageOf(data, r.status), data && data.detail);
    return data;
  }

  return {
    ApiError, base, isNative: native,
    setBase(url){ store.set(K_BASE, url ? url.replace(/\/+$/, '') : null); },
    signedIn: () => !!token(),
    onSignedOut(fn){ onSignedOut = fn; },
    async login(email, password){
      const r = await request('POST', '/auth/login', {email, password});
      saveTokens(r);
      return r.user;
    },
    async activate(email, code, password){
      const r = await request('POST', '/auth/activate', {email, code, password});
      saveTokens(r);
      return r.user;
    },
    // Ending the session on the server is best effort: the device forgets its tokens either way.
    async logout(){
      if (token()) await request('POST', '/auth/logout').catch(() => null);
      store.set(K_TOKEN, null); store.set(K_REFRESH, null);
    },
    async logoutAll(){
      await request('POST', '/auth/logout-all');
      store.set(K_TOKEN, null); store.set(K_REFRESH, null);
    },
    me: () => request('GET', '/auth/me'),
    template: () => request('GET', '/template'),
    projects: () => request('GET', '/projects'),
    project: id => request('GET', `/projects/${id}`),
    createProject: body => request('POST', '/projects', body),
    engineers: () => request('GET', '/users?role=civil_engineer'),
    updateLegal: (id, body) => request('PATCH', `/projects/${id}/legal`, body),
    submitVisit: (id, body) => request('POST', `/projects/${id}/site-visits`, body),
    visit: id => request('GET', `/site-visits/${id}`),
    reviewQueue: () => request('GET', '/reviews/queue'),
    review: (id, body) => request('POST', `/site-visits/${id}/review`, body),

    /* ---------- media (v2) ---------- */
    openDraft: pid => request('POST', `/projects/${pid}/site-visits/draft`),
    stages: pid => request('GET', `/projects/${pid}/stages`),
    projectClients: pid => request('GET', `/projects/${pid}/clients`),
    signoffs: pid => request('GET', `/projects/${pid}/signoffs`),
    sharedUpdates: pid => request('GET', `/projects/${pid}/shared-updates`),
    shareUpdate: (vid, note, media_ids) => request('POST', `/site-visits/${vid}/share`, {note, media_ids}),
    async clientUpdatePhotoUrl(uid, mid){
      const key = `u${uid}-${mid}`;
      if (mediaUrls[key]) return mediaUrls[key];
      const r = await authFetch(`${base()}/client/updates/${uid}/media/${mid}`);
      if (!r.ok) throw new ApiError(r.status, 'Could not load the photo');
      return (mediaUrls[key] = URL.createObjectURL(await r.blob()));
    },
    /* ---------- customer app (/client/*) ---------- */
    clientProjects: () => request('GET', '/client/projects'),
    clientProject: id => request('GET', `/client/projects/${id}`),
    clientSignoff: id => request('GET', `/client/signoffs/${id}`),
    approveSignoff: (id, signer_name) => request('POST', `/client/signoffs/${id}/approve`, {confirm: true, signer_name}),
    requestChanges: (id, comment) => request('POST', `/client/signoffs/${id}/request-changes`, {comment}),
    // Opening a document through this URL is what records the client's review of it.
    async clientDocumentUrl(sid, aid){
      const key = `c${sid}-${aid}`;
      if (mediaUrls[key]) return mediaUrls[key];
      const r = await authFetch(`${base()}/client/signoffs/${sid}/attachments/${aid}`);
      if (!r.ok) throw new ApiError(r.status, 'Could not open the document');
      return (mediaUrls[key] = URL.createObjectURL(await r.blob()));
    },
    createSignoff: (pid, body) => request('POST', `/projects/${pid}/signoffs`, body),
    sendSignoff: id => request('POST', `/signoffs/${id}/send`),
    removeSignoffAttachment: (id, aid) => request('DELETE', `/signoffs/${id}/attachments/${aid}`),
    uploadSignoffAttachment(id, file){ const fd = new FormData(); fd.append('file', file); return requestForm(`/signoffs/${id}/attachments`, fd); },
    inviteClient: (pid, name, email) => request('POST', `/projects/${pid}/client-invite`, {name, email}),
    /* ---------- admin: users and project members ---------- */
    adminUsers: () => request('GET', '/admin/users'),
    createUser: body => request('POST', '/admin/users', body),
    updateUser: (id, body) => request('PATCH', `/admin/users/${id}`, body),
    projectMembers: pid => request('GET', `/projects/${pid}/members`),
    addMember: (pid, uid) => request('POST', `/projects/${pid}/members/${uid}`),
    removeMember: (pid, uid) => request('DELETE', `/projects/${pid}/members/${uid}`),
    recordException: (pid, key, gate, reason) => request('POST', `/projects/${pid}/stages/${key}/exceptions`, {gate, reason}),
    completeStage: (pid, key, note) => request('POST', `/projects/${pid}/stages/${key}/complete`, {note}),
    visits: pid => request('GET', `/projects/${pid}/visits`),
    dashboard: filters => request('GET', '/dashboard' + (Object.keys(filters || {}).length ? '?' + new URLSearchParams(filters) : '')),
    clearFlag: (id, reason) => request('POST', `/red-flags/${id}/clear`, {reason}),
    notifications: () => request('GET', '/notifications'),
    problems: pid => request('GET', `/projects/${pid}/problems`),
    resolveProblem: (id, note) => request('POST', `/problems/${id}/resolve`, {note}),
    readNotification: id => request('POST', `/notifications/${id}/read`),
    readAllNotifications: () => request('POST', '/notifications/read-all'),
    deleteMedia: id => request('DELETE', `/media/${id}`),
    retagMedia: (id, problem_ref) => request('PATCH', `/media/${id}`, {problem_ref}),
    // XMLHttpRequest rather than fetch: only XHR reports upload progress.
    uploadMedia(visitId, file, meta, onProgress, retried){
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest(), t = token();
        xhr.open('POST', `${base()}/site-visits/${visitId}/media`);
        if (t) xhr.setRequestHeader('Authorization', 'Bearer ' + t);
        xhr.upload.onprogress = e => { if (onProgress && e.lengthComputable) onProgress(e.loaded / e.total); };
        xhr.onerror = () => reject(new ApiError(0, `Cannot reach the SiteFlow server at ${base()}. Check your connection.`));
        xhr.onload = () => {
          let data = null; try { data = JSON.parse(xhr.responseText); } catch (_) {}
          if (xhr.status === 401 && t){
            if (!retried){
              renew().then(ok => ok ? this.uploadMedia(visitId, file, meta, onProgress, true).then(resolve, reject)
                : (signedOut(), reject(new ApiError(401, messageOf(data, 401)))));
              return;
            }
            signedOut();
          }
          if (xhr.status >= 200 && xhr.status < 300) resolve(data);
          else reject(new ApiError(xhr.status, messageOf(data, xhr.status), data && data.detail));
        };
        const fd = new FormData();
        fd.append('file', file); fd.append('kind', meta.kind);
        if (meta.problem_ref != null) fd.append('problem_ref', String(meta.problem_ref));
        if (meta.captured_at) fd.append('captured_at', meta.captured_at);
        if (meta.lat != null && meta.lng != null){ fd.append('lat', String(meta.lat)); fd.append('lng', String(meta.lng)); }
        xhr.send(fd);
      });
    },
    // Files need the Bearer token, which an <img src> can't send, so fetch them as blobs.
    async mediaUrl(id){
      if (mediaUrls[id]) return mediaUrls[id];
      const r = await authFetch(`${base()}/media/${id}`);
      if (!r.ok) throw new ApiError(r.status, 'Could not load the file');
      return (mediaUrls[id] = URL.createObjectURL(await r.blob()));
    }
  };
})();

async function applyFilter(el){
  const f = {...ui.data.filters}, v = el.value.trim();
  if (v) f[el.dataset.flt] = v; else delete f[el.dataset.flt];
  saveFilters(f);
  const y = window.scrollY;
  try { await V.dashboard.load(); ui.error = null; } catch (err){ setError(err); ui.data.filters = f; }
  render(); window.scrollTo(0, y);
  const again = document.getElementById(el.id); if (again && el.type !== 'date' && el.tagName !== 'SELECT'){ again.focus(); try { again.setSelectionRange(v.length, v.length); } catch (_) {} }
}

/* Approve unlocks only when every document is opened, the box is ticked and the typed name is the client's. */
function syncApprove(){
  const btn = $('[data-testid="signoff-approve"]'); if (!btn || !ui.data.so) return;
  const allOpened = ui.data.so.attachments.every(a => a.viewed);
  const confirmed = $('#so-confirm').checked, named = normName($('#so-name').value) === normName(ui.me.name) && !!normName(ui.me.name);
  const mark = (id, ok) => { const li = $(id); if (li){ li.className = ok ? 'ok' : 'no'; li.querySelector('.ck').innerHTML = ok ? ico('check') : ''; } };
  mark('#so-need-confirm', confirmed); mark('#so-need-name', named);
  btn.disabled = !(allOpened && confirmed && named);
}

const SIGNOFF_LABEL = {draft: 'Draft', sent: 'Sent', approved: 'Approved', changes_requested: 'Changes requested'};
const SIGNOFF_PILL = {draft: '', sent: 'submitted', approved: 'done', changes_requested: 'rework'};
function signoffComposer(stage){
  const history = (ui.data.signoffs || []).filter(r => r.stage_key === stage.key);
  const last = history[history.length - 1];
  const open = last && (last.status === 'draft' || last.status === 'sent') ? last : null;
  const canPrepare = can.create() && stage.state !== 'completed' && !open;
  const next = last ? last.version + 1 : 1;
  const hist = history.slice().reverse().map(r => `<div class="so-ver" data-testid="signoff-version-${r.version}">
    <div class="row" style="justify-content:space-between"><b>Version ${r.version} · ${esc(SIGNOFF_LABEL[r.status])}</b>${pill(SIGNOFF_PILL[r.status], SIGNOFF_LABEL[r.status])}</div>
    <div class="small muted">${esc(r.title)}${r.sent_at ? ` · sent ${fmtStamp(r.sent_at)}` : ''} · ${r.attachments.length} document${r.attachments.length === 1 ? '' : 's'}</div>
    ${r.status === 'approved' ? `<div class="small"><b>Signed by ${esc(r.signer_name)}</b> ${fmtStamp(r.responded_at)} in the client app.</div>` : ''}
    ${r.status === 'changes_requested' ? `<div class="small"><b>The client asked for changes</b> ${fmtStamp(r.responded_at)}: “${esc(r.response_comment)}”</div>` : ''}</div>`).join('');
  return `<div class="signoff" data-testid="signoff-composer"><div class="subh">Client sign-off</div>
    ${!history.length ? `<p class="small muted">No sign-off package yet.${canPrepare ? ' Prepare one for the client to review and sign in the client app.' : ''}</p>` : ''}
    ${open && open.status === 'draft' && can.create() ? draftEditor(open) : ''}
    ${open && open.status === 'sent' ? `<div class="banner info">${ico('eye')}<span><b>Version ${open.version} · Sent</b> ${fmtStamp(open.sent_at)}. Waiting for the client to review and sign off.</span></div>` : ''}
    ${canPrepare ? `<div class="form so-form"><b class="small">Prepare version ${next}</b>
      <div class="field"><label for="so-title-${stage.key}">Title the client sees</label><input id="so-title-${stage.key}" data-testid="signoff-title" value="${esc(last ? last.title.replace(/version \d+/i, 'version ' + next) : '')}"></div>
      <div class="field"><label for="so-sum-${stage.key}">Summary for the client</label><textarea id="so-sum-${stage.key}" rows="3" data-testid="signoff-summary">${esc(last ? last.summary : '')}</textarea></div>
      ${last ? '<p class="small muted">Attach the updated documents to the new version.</p>' : ''}
      <button class="btn sm primary" data-act="signoff-create" data-key="${stage.key}" data-testid="signoff-create">${ico('plus')}Create version ${next}</button></div>` : ''}
    ${hist ? `<div class="so-hist">${hist}</div>` : ''}
  </div>`;
}
function draftEditor(r){
  return `<div class="form so-form" data-testid="signoff-draft"><b class="small">Version ${r.version} · Draft: ${esc(r.title)}</b>
    <p class="small">${esc(r.summary)}</p>

/* ---------- stage tracker (the 18-stage residential flow) ---------- */
const STAGE_STATE = {completed: ['done', 'Done'], historical: ['', 'Historical'], active: ['active', 'In progress'],
  blocked: ['rework', 'Blocked'], locked: ['', 'Locked']};
function stageTracker(view){
  return `<section class="panel tracker" data-testid="stage-tracker"><div class="panel-h"><h2>Project stages</h2>
      <span class="small muted" data-testid="stage-progress">${view.stage_progress.done} of ${view.stage_progress.total} done</span></div>
    <div class="phases">${view.phases.map(phaseBlock).join('')}</div></section>`;
}
function phaseBlock(ph){
  const lanes = [...new Set(ph.stages.map(s => s.workstream).filter(w => w !== 'Both'))];
  const done = ph.stages.every(s => s.state === 'completed' || s.state === 'historical');
  const current = ph.stages.some(s => s.state === 'active' || s.state === 'blocked');
  let body;
  if (lanes.length > 1){
    // The two pre-design workstreams run in parallel: one column each.
    body = `<div class="lanes">${['Site', 'Studio'].map(w => `<div class="lane"><div class="eyebrow">${w} workstream</div>${ph.stages.filter(s => s.workstream === w).map(stageChip).join('')}</div>`).join('')}</div>`;
  } else {
    // Stages sharing a number (8A, 8B) run in parallel: one row.
    const rows = [];
    ph.stages.forEach(s => { const k = s.number ? s.number.replace(/[A-Z]$/, '') : s.key; const last = rows[rows.length - 1];
      if (last && last.k === k) last.items.push(s); else rows.push({k, items: [s]}); });
    body = rows.map(r => `<div class="srow">${r.items.map(stageChip).join('')}</div>`).join('');
  }
  const open = ph.stages.find(s => s.key === ui.p.openStage);
  return `<div class="phase ${done ? 'phase-done' : current ? 'phase-cur' : ''}" data-testid="phase-${ph.number}">
    <div class="phase-h"><span class="phase-n">${ph.number}</span><b>${esc(ph.name)}</b>${done ? `<span class="small muted">· complete</span>` : ''}</div>
    ${body}${open ? stageDetail(open) : ''}</div>`;
}
function stageChip(s){
  const [cls, label] = STAGE_STATE[s.state];
  return `<button class="stage st-${s.state} ${ui.p.openStage === s.key ? 'open' : ''}" data-act="open-stage" data-key="${s.key}" data-testid="stage-${s.key}" aria-expanded="${ui.p.openStage === s.key}">
    <span class="stage-n">${s.number ? esc(s.number) : ico('flow')}</span>
    <span class="stage-b"><b>${esc(s.label)}</b><span class="small muted">${esc(s.workstream)} · ${esc(ROLES[s.owner_role] || s.owner_role)}${s.signed_by_client ? ' · signed by the client' : ''}</span></span>
    ${pill(cls, label)}</button>`;
}
function stageDetail(s){
  return `<div class="stage-detail" data-testid="stage-detail-${s.key}">
    <p class="small">${esc(s.detail)}</p>
    ${s.reasons.length ? `<ul class="reasons">${s.reasons.map(r => `<li>${ico('alert')}<span>${esc(r)}</span></li>`).join('')}</ul>` : ''}
    ${s.historical ? `<div class="banner info">${ico('flag')}<span><b>${esc(s.historical.label)}</b>. Confirmed by ${esc(s.historical.confirmed_by || 'not recorded')}. ${esc(s.historical.note || '')}</span></div>` : ''}

let TEMPLATE = null;
const MEDIA = typeof API.uploadMedia === 'function';
const visitMedia = () => (ui.data.server && ui.data.server.media) || [];
const photosOf = ref => visitMedia().filter(m => m.kind === 'photo' && m.problem_ref === ref);
const needsPhoto = p => p.severity === 'High' || p.severity === 'Critical';
async function template(){ if (!TEMPLATE) TEMPLATE = await API.template(); return TEMPLATE; }
const draftKey = pid => `siteflow.draft.${ui.me.id}.${pid}`;
function readDraft(pid){ try { return JSON.parse(localStorage.getItem(draftKey(pid)) || 'null'); } catch (_) { return null; } }
function saveDraft(){ try { localStorage.setItem(draftKey(ui.p.pid), JSON.stringify(ui.data.draft)); ui.data.savedAt = Date.now(); } catch (_) {} const l = $('#savedlbl'); if (l) l.textContent = 'Draft saved on this device'; }
function dropDraft(pid){ try { localStorage.removeItem(draftKey(pid)); } catch (_) {} }
const localNow = () => { const d = new Date(); d.setSeconds(0, 0); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
const blankProblem = () => ({category: '', problem: '', other_text: '', severity: '', location: '', responsible_party: '', target_date: ''});

function draftFromVisit(v){
  const f = v.form || {}, loc = f.location || {};
  return {visit_at: localNow(), gps: loc.gps || null, manual: loc.manual || '', weather: f.weather || '', attendees: f.attendees || '',
    current_stage: v.current_stage || '', checklist: {...(v.checklist || {})}, no_issues: !!v.no_issues,
    problems: (v.problems || []).map(p => ({...blankProblem(), ...Object.fromEntries(Object.entries(p).map(([k, x]) => [k, x ?? '']))})),
    summary: f.summary || '', recommended_action: f.recommended_action || ''};
}
const emptyDraft = () => ({visit_at: localNow(), gps: null, manual: '', weather: '', attendees: '', current_stage: '', checklist: {},
  no_issues: false, problems: [], summary: '', recommended_action: ''});

const PROBLEM_LABELS = {category: 'category', problem: 'problem', other_text: 'description', severity: 'severity',
  location: 'location on site', responsible_party: 'responsible party', target_date: 'target fix date',
  photo: 'photo of the problem (High and Critical)'};
function visitLabel(path){
  const fixed = {visit_at: 'Visit date and time', location: 'Location (GPS or manual entry)', 'location.gps': 'GPS coordinates',
    weather: 'Weather', attendees: 'Attendees', current_stage: 'Construction stage', problems: 'Problems, or tick “No issues found”',
    no_issues: '“No issues found” cannot be ticked while problems are listed', summary: 'Summary', recommended_action: 'Recommended action'};
  if (fixed[path]) return fixed[path];
  if (path === 'photos'){
    const n = visitMedia().filter(x => x.kind === 'photo').length;
    return `Photos: at least ${TEMPLATE ? TEMPLATE.min_photos : ''} (${n} added)`;
  }
  let m = path.match(/^checklist\.(.+)$/);
  if (m){ const it = (TEMPLATE ? TEMPLATE.stages.flatMap(s => s.checklist) : []).find(i => i.id === m[1]); return `Checklist: ${it ? it.label : m[1]}`; }
  m = path.match(/^problems\[(\d+)\]\.(.+)$/);
  if (m) return `Problem ${+m[1] + 1}: ${PROBLEM_LABELS[m[2]] || m[2]}`;
  return path;
}

/* Mirrors the server's validation so the engineer sees what is missing before submitting. */
function visitMissing(d){
  const miss = [];
  const blank = v => !String(v ?? '').trim();
  if (blank(d.visit_at)) miss.push('visit_at');
  if (!d.gps && blank(d.manual)) miss.push('location');
  ['weather', 'attendees', 'current_stage'].forEach(k => { if (blank(d[k])) miss.push(k); });
  const stage = TEMPLATE.stages.find(s => s.name === d.current_stage);
  if (stage) stage.checklist.forEach(i => { if (!d.checklist[i.id]) miss.push('checklist.' + i.id); });
  if (!d.no_issues && !d.problems.length) miss.push('problems');
  if (d.no_issues && d.problems.length) miss.push('no_issues');
  d.problems.forEach((p, n) => {
    const at = `problems[${n}]`;
    if (blank(p.category)) miss.push(at + '.category');
    else if (p.category === 'Other'){ if (blank(p.other_text)) miss.push(at + '.other_text'); }
    else if (blank(p.problem)) miss.push(at + '.problem');
    ['severity', 'location', 'responsible_party', 'target_date'].forEach(k => { if (blank(p[k])) miss.push(`${at}.${k}`); });
  });
  if (MEDIA){
    if (visitMedia().filter(m => m.kind === 'photo').length < TEMPLATE.min_photos) miss.push('photos');
    d.problems.forEach((p, n) => { if (needsPhoto(p) && !photosOf(n).length) miss.push(`problems[${n}].photo`); });
  }
  ['summary', 'recommended_action'].forEach(k => { if (blank(d[k])) miss.push(k); });
  return miss;
}

function visitPayload(d){
  const s = v => (String(v ?? '').trim() || null);
  const stage = TEMPLATE.stages.find(x => x.name === d.current_stage);
  const ids = stage ? stage.checklist.map(i => i.id) : [];
  return {
    visit_at: d.visit_at ? new Date(d.visit_at).toISOString() : null,
    location: {gps: d.gps, manual: s(d.manual)},
    weather: s(d.weather), attendees: s(d.attendees), current_stage: s(d.current_stage),
    checklist: Object.fromEntries(Object.entries(d.checklist).filter(([k]) => ids.includes(k))),
    no_issues: d.no_issues,
    problems: d.problems.map(p => ({category: s(p.category), problem: p.category === 'Other' ? null : s(p.problem),
      other_text: p.category === 'Other' ? s(p.other_text) : null, severity: s(p.severity), location: s(p.location),
      responsible_party: s(p.responsible_party), target_date: s(p.target_date)})),
    summary: s(d.summary), recommended_action: s(d.recommended_action)
  };
}

/* A file input per pick, so the camera opens straight away where the device supports capture. */
function pickFiles(kind, capture, ref){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.hidden = true;
  inp.accept = (kind === 'photo' ? TEMPLATE.photo_types : TEMPLATE.video_types).join(',');
  if (capture) inp.setAttribute('capture', 'environment');
  inp.multiple = kind === 'photo' && ref === null && !capture;
  inp.addEventListener('change', () => { const files = [...inp.files]; inp.remove(); uploadFiles(files, kind, ref); });
  document.body.appendChild(inp);
  inp.click();
}

async function uploadFiles(files, kind, ref){
  const T = TEMPLATE, types = kind === 'photo' ? T.photo_types : T.video_types;
  const limit = (kind === 'photo' ? T.max_photo_mb : T.max_video_mb) * 1048576;
  for (const f of files){
    if (!types.includes(f.type)){ toast(`${f.name || 'That file'} is not a supported ${kind}. Use ${types.map(t => t.split('/')[1].toUpperCase()).join(', ')}.`); continue; }
    if (f.size > limit){ toast(`${f.name || 'That file'} is over the ${limit / 1048576} MB limit for a ${kind}.`); continue; }
    const up = {id: Math.random().toString(36).slice(2), ref, pct: 0};
    ui.data.uploads.push(up); rerenderKeepScroll();
    // A camera file's lastModified is when it was taken; files older than a day use the upload time.
    const taken = f.lastModified && Date.now() - f.lastModified < 864e5 ? new Date(f.lastModified) : new Date();
    const gps = ui.data.draft.gps;
    try {
      const m = await API.uploadMedia(ui.data.server.id, f, {kind, problem_ref: ref, captured_at: taken.toISOString(),
        lat: gps ? gps.lat : null, lng: gps ? gps.lng : null}, pct => { up.pct = pct; const bar = $('#up-' + up.id); if (bar) bar.style.width = Math.round(pct * 100) + '%'; });
      ui.data.server.media.push(m);
    } catch (err){
      toast(err.status === 413 || err.status === 415 ? err.message : `Upload failed: ${err.message}`);
    } finally {
      ui.data.uploads = ui.data.uploads.filter(u => u !== up);
      if (ui.route === 'visit') rerenderKeepScroll();
    }
  }
}

async function decide(decision){
  const v = ui.data.visit, comment = ($('#rv-c') ? $('#rv-c').value : '').trim();
  ui.p.comment = comment;
  if (decision === 'rework' && !comment){ ui.error = {message: 'Add a comment so the engineer knows what to fix.', items: []}; render(); return; }
  try {
    await API.review(v.id, {decision, comment: comment || null});
    toast(decision === 'approve' ? 'Approved. Progress is now official.' : 'Sent back for rework.');
    await go('project', {pid: v.project.id});
  } catch (err){ setError(err, {comment: 'Comment'}); render(); }
}

function render(){
  document.body.classList.toggle('anon', !ui.me);
  if (!ui.me){ $('#side').innerHTML = ''; $('#tabs').innerHTML = ''; $('#main').innerHTML = V.login.html(); return; }
  const v = V[ui.route] || V.projects;
  $('#main').innerHTML = shell() + (ui.loadError ? `<div class="errbox" data-testid="load-error">${esc(ui.loadError)}</div>` : v.html()) + lightbox();
  document.body.classList.toggle('focus', ui.route === 'visit');
  if (ui.route === 'project') syncLegalSave();
  hydrateMedia();
}

/* Thumbnails are fetched with the sign-in token after each render. */
function hydrateMedia(){
  if (API.clientUpdatePhotoUrl) document.querySelectorAll('img[data-cuid]:not([src])').forEach(async img => {
    try { img.src = await API.clientUpdatePhotoUrl(+img.dataset.cuid, +img.dataset.cmid); } catch (_) { img.alt = 'Photo could not be loaded'; }
  });
  if (!MEDIA || isClient()) return;
  document.querySelectorAll('img[data-mid]:not([src])').forEach(async img => {
    try { img.src = await API.mediaUrl(+img.dataset.mid); } catch (_) { img.alt = 'Photo could not be loaded'; }
  });
  document.querySelectorAll('video[data-mid]:not([src])').forEach(async v => {
    try { v.src = await API.mediaUrl(+v.dataset.mid); } catch (_) {}
  });
}

/* Save stays disabled for Approved until a document reference is entered. */
function syncLegalSave(){
  const st = $('#lg-status'), doc = $('#lg-doc'), btn = $('[data-testid="legal-save"]');
  if (!st || !btn) return;
  const blocked = st.value === 'Approved' && !doc.value.trim();
  btn.disabled = blocked;
  $('#lg-hint').textContent = blocked ? 'Attach the approval document to save as Approved.' : '';
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }

    case 'signoff-attach': {
      const id = +a.dataset.id, inp = document.createElement('input');
      inp.type = 'file'; inp.hidden = true; inp.accept = 'application/pdf,image/jpeg,image/png,image/webp';
      inp.addEventListener('change', async () => {
        const f = inp.files[0]; inp.remove(); if (!f) return;
        try { await API.uploadSignoffAttachment(id, f); await reloadSignoffs(); ui.error = null; } catch (err){ toast(err.message); }
        rerenderKeepScroll();
      });
      document.body.appendChild(inp); inp.click(); break; }
    case 'signoff-remove':
      try { await API.removeSignoffAttachment(+a.dataset.id, +a.dataset.aid); await reloadSignoffs(); } catch (err){ toast(err.message); }
      rerenderKeepScroll(); break;
    case 'signoff-send':
      a.disabled = true;
      try { await API.sendSignoff(+a.dataset.id); toast('Sent. The client sees it in the client app.'); await V.project.load(); ui.error = null; }
      catch (err){ setError(err); }
      rerenderKeepScroll(); break;
    case 'open-stage': ui.p.openStage = ui.p.openStage === a.dataset.key ? null : a.dataset.key; rerenderKeepScroll(); break;
    case 'stage-exception': {
      const key = a.dataset.key, gate = $('#ex-gate-' + key).value, reason = (($('#ex-reason-' + key) || {}).value || '').trim();
      if (!reason){ toast('Give a reason for the exception.'); break; }
      a.disabled = true;
      try { await API.recordException(ui.data.project.id, key, gate, reason); toast('Exception recorded.'); await V.project.load(); ui.error = null; }
      catch (err){ setError(err); }
      rerenderKeepScroll(); break; }
    case 'stage-complete': {
      const key = a.dataset.key, note = (($('#st-note-' + key) || {}).value || '').trim();
      if (!note){ toast('Add a note on what was completed.'); break; }
      a.disabled = true;
      try { await API.completeStage(ui.data.project.id, key, note); toast('Stage completed.'); await V.project.load(); ui.error = null; }
      catch (err){ setError(err); }
      rerenderKeepScroll(); break; }
    case 'open-photo': ui.data.lbMedia = [{id: +a.dataset.mid, kind: 'photo', captured_at: null, lat: null, problem_ref: null, uploader: null}];
      ui.lightbox = +a.dataset.mid; rerenderKeepScroll(); break;
    case 'resolve': ui.p.resolving = +a.dataset.id; rerenderKeepScroll(); { const i = $('#rs-' + a.dataset.id); if (i) i.focus(); } break;
    case 'resolve-cancel': ui.p.resolving = null; rerenderKeepScroll(); break;
    case 'resolve-confirm': {
      const note = (($('#rs-' + a.dataset.id) || {}).value || '').trim();
      if (!note){ toast('Say how the problem was fixed.'); break; }
      try { await API.resolveProblem(+a.dataset.id, note); ui.p.resolving = null; toast('Problem resolved.'); await V.project.load(); ui.error = null; }
      catch (err){ setError(err); }
      rerenderKeepScroll(); break; }
    case 'open-note':
      try { await API.readNotification(+a.dataset.id); } catch (_) {}
      if (a.dataset.pid) await go(isClient() ? 'client-project' : 'project', {pid: +a.dataset.pid}); else await go('alerts');
      break;
    case 'read-all':
      try { await API.readAllNotifications(); ui.unread = 0; toast('All notifications marked read.'); } catch (err){ toast(err.message); }
      await go('alerts'); break;
    case 'flag-clear': ui.p.clearing = +a.dataset.id; rerenderKeepScroll(); { const i = $('#fr-' + a.dataset.id); if (i) i.focus(); } break;
    case 'flag-cancel': ui.p.clearing = null; rerenderKeepScroll(); break;
    case 'flag-confirm': {
      const reason = ($('#fr-' + a.dataset.id) || {}).value || '';
      if (!reason.trim()){ toast('Give a reason for clearing this red flag.'); break; }
      try { await API.clearFlag(+a.dataset.id, reason.trim()); ui.p.clearing = null; toast('Red flag cleared. The reason is in the audit trail.'); await V.dashboard.load(); ui.error = null; }
      catch (err){ setError(err); }
      rerenderKeepScroll(); break; }
    case 'flt-reset': e.preventDefault(); saveFilters({}); await go('dashboard'); break;
    case 'close-media': ui.lightbox = null; rerenderKeepScroll(); break;
    case 'pick-media': pickFiles(a.dataset.kind, !!a.dataset.capture, a.dataset.ref === undefined ? null : +a.dataset.ref); break;
    case 'del-media':
      try { await API.deleteMedia(+a.dataset.id); ui.data.server.media = visitMedia().filter(m => m.id !== +a.dataset.id); rerenderKeepScroll(); }
      catch (err){ toast(err.message); }
      break;
    case 'clear-gps': ui.data.draft.gps = null; saveDraft(); rerenderKeepScroll(); break;
    case 'gps':
      if (!navigator.geolocation){ toast('GPS is not available here. Describe the location instead.'); break; }
      a.disabled = true; a.textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(pos => {
        ui.data.draft.gps = {lat: pos.coords.latitude, lng: pos.coords.longitude}; saveDraft(); rerenderKeepScroll(); toast('Location captured.');
      }, () => { rerenderKeepScroll(); toast('Could not get a GPS fix. Describe the location instead.'); }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
      break;
    case 'submit-visit': {
      const d = ui.data.draft;
      if (visitMissing(d).length){ refreshVisit(); toast('Some required items are missing.'); break; }
      a.disabled = true;
      try {
        const v = await API.submitVisit(ui.p.pid, visitPayload(d));
        dropDraft(ui.p.pid);
        toast(`Submitted for review. Derived progress ${pct(v.computed_progress)}.`);
        await go('project', {pid: ui.p.pid});
      } catch (err){ setError(err, visitLabel); rerenderKeepScroll(); window.scrollTo(0, 0); }
      break; }
    case 'review-approve': decide('approve'); break;
    case 'review-rework': decide('rework'); break;
  }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    switch (form.dataset.form){
      case 'activate': {
        ui.loginEmail = $('#ac-email').value.trim();
        ui.activateCode = $('#ac-code').value.trim();
        const password = $('#ac-pass').value;
        // Keep what was typed across the re-render; only a rejected code is cleared.
        if (password.length < 10){ ui.error = 'Choose a password of at least 10 characters.'; render(); return; }
        try { ui.me = await API.activate(ui.loginEmail, ui.activateCode, password); }
        catch (err){ ui.error = err.message; if (err.status === 400) ui.activateCode = ''; render(); return; }
        ui.error = null; ui.activating = false; ui.activateCode = ''; toast('Welcome to SiteFlow.'); await go(home()); break;
      }
      case 'add-user': {
        const body = {name: $('#au-name').value.trim(), email: $('#au-email').value.trim(), role: $('#au-role').value};
        try { ui.data.created = await API.createUser(body); ui.data.users = await API.adminUsers(); ui.error = null; }
        catch (err){ setError(err); }
        render(); break;
      }
      case 'login': {
        ui.loginEmail = $('#li-email').value.trim();
        try { ui.me = await API.login(ui.loginEmail, $('#li-pass').value); }
        catch (err){ ui.error = err.message; render(); const pw = $('#li-pass'); if (pw) pw.focus(); return; }
        ui.error = null; await go(home()); break;
      }
      case 'new-project': {
        const start = $('#np-start') ? $('#np-start').value : '', confirmer = $('#np-confirmer') ? $('#np-confirmer').value.trim() : '';
        const val = id => ($(id) ? $(id).value.trim() : '');
        const cl = {client_name: val('#np-client'), client_phone: val('#np-client-phone'), client_email: val('#np-client-email'),
          site_address: val('#np-site'), site_city: val('#np-city')};
        const body = {name: $('#np-name').value.trim(), location: $('#np-loc').value.trim(),
          civil_engineer_id: +$('#np-eng').value || null, legal_expected_date: $('#np-date').value || null,
          ...(start ? {start_stage: start, historical_confirmed_by: confirmer} : {}),
          ...(cl.client_name ? {client: {name: cl.client_name,
            contacts: cl.client_phone || cl.client_email ? [{name: cl.client_name, phone: cl.client_phone || null, email: cl.client_email || null, is_signatory: true}] : []}} : {}),
          ...(cl.site_address ? {site: {address: cl.site_address, city: cl.site_city || null}} : {})};
        const miss = [!body.name && 'Project name', !body.location && 'Location', !body.civil_engineer_id && 'Civil Engineer'].filter(Boolean);
        ui.p.form = {...body, start_stage: start, historical_confirmed_by: confirmer, ...cl};
        if (miss.length){ ui.error = {message: `${miss.join(', ')} ${miss.length === 1 ? 'is' : 'are'} required.`, items: []}; render(); return; }
        if (start && !confirmer){ ui.error = {message: 'Who confirmed the earlier stages? Add a name to onboard a project mid-way.', items: []}; render(); return; }
        try { const p = await API.createProject(body); toast(`${p.name} created. ${(p.current_stages || []).join(' + ') || 'The first stage'} is open.`); await go('project', {pid: p.id}); }
        catch (err){ setError(err); render(); }
        break;
      }
      case 'legal': {
        const p = ui.data.project, la = p.legal_approval;
        const body = {};
        const status = $('#lg-status').value; if (status !== la.status) body.status = status;
        const vals = {authority_name: '#lg-auth', application_reference: '#lg-ref', application_date: '#lg-adate', approval_date: '#lg-pdate', document_reference: '#lg-doc'};
        const draft = {status};
        Object.entries(vals).forEach(([k, sel]) => { const v = $(sel).value.trim(); draft[k] = v; if (v && v !== (la[k] || '')) body[k] = v; });
        try { ui.data.project = await API.updateLegal(p.id, body); ui.error = null; ui.data.legalDraft = null; toast(status === 'Approved' ? 'Legal Approval approved. Site Visit is open.' : 'Legal Approval saved.'); }
        catch (err){ setError(err, LEGAL_FIELDS); ui.data.legalDraft = draft; }
        render(); break;
      }
    }
  } finally { if (btn && btn.isConnected) btn.disabled = false; if (ui.route === 'project') syncLegalSave(); }
});

function setProblem(el){ const [n, k] = el.dataset.p.split('.'); const pr = ui.data.draft.problems[+n]; pr[k] = el.value; if (k === 'category'){ pr.problem = ''; pr.other_text = ''; } }
document.addEventListener('input', e => {
  const el = e.target;
  if (ui.route === 'visit' && ui.data.draft && el.tagName !== 'SELECT' && el.type !== 'checkbox'){
    if (el.dataset.v){ ui.data.draft[el.dataset.v] = el.value; saveDraft(); refreshVisit(); return; }
    if (el.dataset.p){ setProblem(el); saveDraft(); refreshVisit(); return; }
  }
  if (el.id === 'lg-doc') syncLegalSave();
});
document.addEventListener('input', e => { if (e.target.id === 'so-name') syncApprove(); });
document.addEventListener('change', e => { if (e.target.id === 'so-confirm') syncApprove(); });

let fltTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.flt || el.tagName === 'SELECT' || el.type === 'date') return;
  clearTimeout(fltTimer); fltTimer = setTimeout(() => applyFilter(el), 350);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.flt && (el.tagName === 'SELECT' || el.type === 'date')){ applyFilter(el); return; }
  if (ui.route === 'visit' && ui.data.draft){
    const d = ui.data.draft;
    if (el.dataset.v) d[el.dataset.v] = el.type === 'checkbox' ? el.checked : el.value;
    else if (el.dataset.chk) d.checklist[el.dataset.chk] = el.value;
    else if (el.dataset.p) setProblem(el);
    else return;
    saveDraft();
    if (el.dataset.rerender) rerenderKeepScroll(); else refreshVisit();
    return;
  }
  if (el.id === 'lg-status') syncLegalSave();
});
window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());
if (isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
  window.Capacitor.Plugins.App.addListener('backButton', () => { if (ui.route !== home() && ui.me) go(home()); else window.Capacitor.Plugins.App.exitApp(); });
}

/* ---------- boot ---------- */
(async () => {
  if (!API.signedIn()) return showLogin();
  try { ui.me = await API.me(); await go(home()); }
  catch (e) { showLogin(API.signedIn() ? e.message : null); }
})();
})();

</script>

</body>
</html>
