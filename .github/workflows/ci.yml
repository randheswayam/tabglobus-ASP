name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: |
          ruff check .
          ruff format --check .

  backend-tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  backend-tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siteflow
          POSTGRES_PASSWORD: siteflow
          POSTGRES_DB: siteflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siteflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway database in the service container; not a real credential.
      TEST_DATABASE_URL: postgresql+psycopg://siteflow:siteflow@localhost:5432/siteflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  backend-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt semgrep
      - name: semgrep
        run: >-
          semgrep scan --error --metrics=off --quiet
          --config p/python --config p/fastapi --config p/secrets --config p/jwt --config p/sql-injection app/
      - name: pip-audit
        run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: eslint
        run: npm run lint
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: semgrep (web)
        run: |
          pip install semgrep
          semgrep scan --error --metrics=off --quiet --config p/javascript --config p/xss --config p/secrets web-src tests/e2e
      - name: npm audit
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-evidence
          path: |
            tests/screenshots
            test-results
