name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The hosted Ubuntu runner already has the Android SDK and sets ANDROID_HOME.
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK at $ANDROID_HOME"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SiteFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # The client demo as a second app: sample data in the app itself, no server needed.
      - name: Build demo APK
        run: |
          cp demo/SiteFlow-Demo.html www/index.html
          sed -i 's|>SiteFlow<|>SiteFlow Demo<|' android/app/src/main/res/values/strings.xml
          npx cap copy android
          cd android
          ./gradlew assembleDebug -PsiteflowDemo --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/siteflow-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SiteFlow-demo-apk
          path: android/app/build/outputs/apk/debug/siteflow-demo.apk
